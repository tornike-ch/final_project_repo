}
function stepDemo(d){ const i = TPL.indexOf(dlgInv.t); openDemo(TPL[(i + d + TPL.length) % TPL.length].id); }
$('#stClose').innerHTML = ic('close'); $('#stPrev').innerHTML = ic('arrowL'); $('#stNext').innerHTML = ic('arrowR');
$('#stClose').addEventListener('click', () => dlg.close());
$('#stPrev').addEventListener('click', () => stepDemo(-1));
$('#stNext').addEventListener('click', () => stepDemo(1));
dlg.addEventListener('close', () => { if (dlgInv) dlgInv.clear(); });
dlg.addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if (e.key === 'ArrowRight') stepDemo(1); if (e.key === 'ArrowLeft') stepDemo(-1); });
$('#stRestart').addEventListener('click', () => dlgInv && dlgInv.reset());
$('#stReq').addEventListener('click', () => {
  const t = dlgInv.t; dlg.close();
  const k = {academy:'learn', interview:'onboard', campaign:'engage'}[t.id] || 'attend';
  requestFor('demo', k, t.id);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-req]'); if (!b) return;
  requestFor(b.dataset.req, b.dataset.who || goalK, '');
});

/* ---------- the request ---------- */
const slipNo = String(Math.floor(1000 + Math.random() * 8999));
const RING = '<svg class="ring" viewBox="0 0 120 44" preserveAspectRatio="none" aria-hidden="true"><path d="M9 25C6 10 56 3 102 8c15 2 13 26-5 30-28 6-78 6-88-5C3 26 12 14 32 9"/></svg>';
let interest = '', interestTpl = '', lastReq = null;
function requestFor(type, who, tpl){
  $('#result').hidden = true; $('#reqForm').hidden = false;
  interest = type || ''; interestTpl = tpl || '';
  if (who){ const r = document.getElementById('who-' + who); if (r) r.checked = true; }
  renderInterest();
  $('#request').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'start'});
  setTimeout(() => $('#fName').focus({preventScroll:true}), reduced() ? 0 : 700);
}
function renderInterest(){
  const F = S[lang].f, lbl = F.interest[interest];
  const tname = interestTpl && TBY[interestTpl] ? tx(TBY[interestTpl].name) : '';
  $('#interestBox').innerHTML = (lbl || tname) ? '<span class="interest">'+esc(F.picked)+' '+esc([lbl, tname].filter(Boolean).join(' · '))+'<button type="button" id="clearInt" aria-label="'+esc(F.clear)+'">'+ic('close')+'</button></span>' : '';
  const c = $('#clearInt'); if (c) c.addEventListener('click', () => { interest = ''; interestTpl = ''; renderInterest(); });
}
function renderForm(){
  const F = S[lang].f;
  const who = (document.querySelector('input[name="who"]:checked') || {}).value || 'learn';
  $('#whoSeg').innerHTML = F.whoOpts.map(o => '<label class="circ"><input type="radio" name="who" id="who-'+o[0]+'" value="'+o[0]+'"'+(o[0] === who ? ' checked' : '')+'><span class="t">'+esc(o[1])+'</span>'+RING+'</label>').join('');
  renderInterest();
  const d = new Date();
  $('#slipNo').textContent = F.slip + ' ' + slipNo + ' · ' + d.getDate() + ' ' + S[lang].months[d.getMonth()] + ' ' + d.getFullYear();
  $('#sendRing').innerHTML = seal(caps(S[lang].req.sendRing), '');
  if (!$('#result').hidden && lastReq) showResult(lastReq.mode);
}
function readForm(){
  const F = S[lang].f, who = (document.querySelector('input[name="who"]:checked') || {}).value || '';
  return {who, whoLabel:(F.whoOpts.find(o => o[0] === who) || ['', ''])[1], interest, interestLabel:F.interest[interest] || '',
    template:interestTpl, templateLabel: interestTpl && TBY[interestTpl] ? tx(TBY[interestTpl].name) : '',
    name:$('#fName').value.trim(), contact:$('#fContact').value.trim(), message:$('#fMsg').value.trim(), lang};
}
function reqText(r){
  const F = S[lang].f, n = v => v || F.none;
  return [F.subj + ' (' + F.slip + ' ' + slipNo + ')', '', F.goal + ': ' + n(r.whoLabel) + '\n' + F.type + ': ' + n(r.interestLabel), F.tpl + ': ' + n(r.templateLabel),
    F.name + ': ' + n(r.name), F.contact + ': ' + n(r.contact), F.msg + ': ' + n(r.message)].join('\n');
}
function showResult(mode){
  const F = S[lang].f, box = $('#result');
  const head = mode === 'ok' ? F.okH : mode === 'fail' ? F.failH : F.readyH;
  const body = mode === 'ok' ? F.ok : fill(mode === 'fail' ? F.fail : F.ready, {email:CONFIG.email});
  const word = mode === 'ok' ? F.okC : mode === 'fail' ? F.failC : F.readyC;
  box.innerHTML = '<div class="rs">'+seal(caps(F.ring), caps(word))+'</div><h3>'+esc(head)+'</h3><p>'+esc(body)+'</p>'+
    '<div class="beats4">'+S[lang].beat.map((b, i) => '<span><i>'+(i + 1)+'</i>'+esc(b)+'</span>').join('')+'</div>'+
    (mode !== 'ok' ? '<pre id="reqText">'+esc(reqText(lastReq))+'</pre>' : '')+
    '<div class="row">'+(mode !== 'ok' ? '<button type="button" class="btn" id="copyReq">'+ic('copy')+'<span>'+esc(F.copy)+'</span></button>' : '')+
    '<button type="button" class="tlink" id="editReq">'+esc(F.edit)+'</button></div>';
  box.hidden = false; $('#reqForm').hidden = true;
  const cp = $('#copyReq');
  if (cp) cp.addEventListener('click', () => {
    const text = reqText(lastReq), ok = () => { cp.querySelector('span').textContent = F.copied; };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('#reqText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, sel); else sel();
  });
  $('#editReq').addEventListener('click', () => { box.hidden = true; $('#reqForm').hidden = false; $('#fName').focus(); });
}
function validate(){
  const F = S[lang].f;
  const name = $('#fName').value.trim(), contact = $('#fContact').value.trim();
  const cOk = /@/.test(contact) || contact.replace(/\D/g, '').length >= 9;
  $('#fbName').classList.toggle('bad', !name); $('#eName').textContent = name ? '' : F.eName;
  $('#fbContact').classList.toggle('bad', !cOk); $('#eContact').textContent = cOk ? '' : F.eContact;
  $('#fName').setAttribute('aria-invalid', !name); $('#fContact').setAttribute('aria-invalid', !cOk);
  if (!name){ $('#fName').focus(); return false; }
  if (!cOk){ $('#fContact').focus(); return false; }
  return true;
}
$('#reqForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!validate()) return;
  lastReq = readForm();
  const sb = $('#sendBtn'); sb.classList.remove('thump'); void sb.offsetWidth; sb.classList.add('thump');
  setTimeout(() => {
    stamp('start');
    if (!CONFIG.formEndpoint){ lastReq.mode = 'ready'; showResult('ready'); return; }
    sb.disabled = true;
    fetch(CONFIG.formEndpoint, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(Object.assign({slip:slipNo, summary:reqText(lastReq)}, lastReq))})
      .then(r => { if (!r.ok) throw new Error(r.status); lastReq.mode = 'ok'; showResult('ok'); })
      .catch(() => { lastReq.mode = 'fail'; showResult('fail'); })
      .finally(() => { sb.disabled = false; });
  }, reduced() ? 0 : 420);
});
['#fName','#fContact'].forEach(id => $(id).addEventListener('input', () => { if ($(id).closest('.field').classList.contains('bad')) validate(); }));

/* ---------- theme, language ---------- */
function effTheme(){
  const a = document.documentElement.getAttribute('data-theme');
  if (a === 'dark' || a === 'light') return a;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function themeIcon(){ const b = $('#themeBtn'); b.innerHTML = ic(effTheme() === 'dark' ? 'sun' : 'moon'); b.setAttribute('aria-label', S[lang].ui.theme); }
const savedTheme = store.get('theme');
if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
$('#themeBtn').addEventListener('click', () => { const next = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store.set('theme', next); themeIcon(); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon);
$$('[data-lang]').forEach(b => b.addEventListener('click', () => { if (lang === b.dataset.lang) return; lang = b.dataset.lang; store.set('lang', lang); renderAll(); }));

/* ---------- go ---------- */
function renderAll(){
  applyStatic(); renderPoster(); renderGoals(); renderBrief(); renderDash(false); renderStart(); renderForm();
  invites.forEach(i => i.render());
  if (dlg.open && dlgInv) fillStage(dlgInv.t);
}
pickGoal('learn');
renderAll();
let fitT = 0;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitPoster, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPoster);
})();
</script>
</body>
