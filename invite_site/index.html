<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>პატიჟი · Patizhi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ინტერაქტიული მოსაწვევები რესტორნებისთვის: სტუმარი ჯავშნის მაგიდას ორზე და იღებს მოსაწვევს რესტორნის ბრენდით, მენიუთი და ჯავშნის დეტალებით.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,400..800&family=Noto+Serif+Georgian:wdth,wght@62.5..100,500..900&family=Shippori+Mincho:wght@800&display=swap">
<style>
:root{
  /* Layout: a stationery desk. The copy is the letter on the left and the live invite sits on a phone at right;
     below come a wall of invites, a rate card set like a restaurant menu, and a request slip with a perforated edge. */
  --bg:#ECEEF3; --bg2:#E2E5EE; --surface:#FFFFFF; --surface2:#F4F5F9;
  --ink:#171A2E; --ink2:#3B3F5A; --muted:#5C6180; --line:#D2D6E2;
  --acc:#B4302A; --acc-ink:#FFFFFF; --acc-soft:#F3DEDC; --gold:#86672A;
  --hdr:rgba(236,238,243,.88); --device:#14151F; --scrim:rgba(14,16,32,.55);
  --shadow:0 1px 2px rgba(23,26,46,.06),0 14px 34px -12px rgba(23,26,46,.24);
  --f-disp:"Noto Serif Georgian",Georgia,"Times New Roman",serif;
  --f-body:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:19px; --t-xl:24px;
  --t-2xl:clamp(30px,4vw,46px); --t-3xl:clamp(42px,6.4vw,80px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1020; --bg2:#13162A; --surface:#181B30; --surface2:#1F2339;
    --ink:#ECEBF4; --ink2:#C9CADB; --muted:#9A9DB7; --line:#2C3050;
    --acc:#D2433A; --acc-ink:#FFFFFF; --acc-soft:#2E1828; --gold:#CDA862;
    --hdr:rgba(14,16,32,.86); --device:#04050B; --scrim:rgba(3,4,12,.72);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -14px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1020; --bg2:#13162A; --surface:#181B30; --surface2:#1F2339;
  --ink:#ECEBF4; --ink2:#C9CADB; --muted:#9A9DB7; --line:#2C3050;
  --acc:#D2433A; --acc-ink:#FFFFFF; --acc-soft:#2E1828; --gold:#CDA862;
  --hdr:rgba(14,16,32,.86); --device:#04050B; --scrim:rgba(3,4,12,.72);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-md);line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr)}
.page{overflow-x:clip}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section[id]{scroll-margin-top:84px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type */
.disp{font-family:var(--f-disp);font-stretch:72%;font-weight:800;line-height:1.14;letter-spacing:-.005em;text-wrap:balance;margin:0}
h1.disp{font-size:var(--t-3xl)}
h2.disp{font-size:var(--t-2xl)}
h3{font-family:var(--f-disp);font-stretch:85%;font-weight:700;font-size:var(--t-lg);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:var(--t-lg);color:var(--ink2);max-width:58ch;line-height:1.65}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin:0 0 12px}
html[lang="en"] .caps{text-transform:uppercase}
.muted{color:var(--muted)}
.fine{font-size:var(--t-xs);color:var(--muted)}

/* icons */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico .f{fill:var(--f,none)}
.ico .s{fill:currentColor;stroke:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s,background-color .2s,border-color .2s;line-height:1.2}
.btn:active{transform:scale(.97)}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--acc) 88%,var(--ink))}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink2)}
.btn.small{padding:9px 16px;font-size:14px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn .ico{width:19px;height:19px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);flex-shrink:0}
.mark{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--acc);border-radius:9px;transform:rotate(-8deg);color:var(--acc);font-family:var(--f-disp);font-weight:900;font-size:19px;line-height:1;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3.5px var(--acc)}
.word{font-family:var(--f-disp);font-stretch:72%;font-weight:800;font-size:23px;letter-spacing:.01em}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14.5px;white-space:nowrap}
nav.main a:hover{background:var(--surface2);color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.langsw{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.langsw button{border:0;background:transparent;padding:6px 10px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none}
.mnav{display:none;border-top:1px solid var(--line);background:var(--hdr)}
.mnav.open{display:block}
.mnav .wrap{display:flex;flex-direction:column;padding-block:8px 16px}
.mnav a{padding:12px 4px;text-decoration:none;border-bottom:1px solid var(--line);font-size:16px}
.mnav .btn{margin-top:14px}
@media (max-width:980px){nav.main,.hdr .cta-top{display:none}.menu-btn{display:grid}.tools{margin-left:auto}}

/* hero */
.hero{position:relative;overflow:clip}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:48px;align-items:center;padding-block:64px 76px}
.hero-copy{min-width:0}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero .lead{margin-top:22px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.facts{display:flex;flex-wrap:wrap;gap:12px 26px;margin:34px 0 0;padding:0;list-style:none;font-size:var(--t-sm);color:var(--muted)}
.facts li{display:flex;gap:9px;align-items:center}
.facts .ico{color:var(--gold);width:19px;height:19px}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
.stage::before{content:"";position:absolute;width:min(470px,100%);aspect-ratio:1;border-radius:50%;background:var(--acc-soft);top:44%;left:50%;transform:translate(-50%,-50%);z-index:0}
.stage>*{position:relative;z-index:1}
.stage .cap{font-size:var(--t-xs);color:var(--muted);display:flex;align-items:center;gap:8px}
.stage .cap i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:400px}
.sw button{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--ink2)}
.sw button[aria-pressed="true"]{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 1px var(--acc)}
.sw i{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 0 0 1px var(--line)}
.sw-label{font-size:var(--t-xs);color:var(--muted)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:40px 56px}}

/* phone device */
.phone{position:relative;width:300px;max-width:100%;aspect-ratio:300/620;background:var(--device);border-radius:46px;padding:10px;box-shadow:0 34px 60px -24px rgba(8,10,30,.55),0 0 0 1px var(--line)}
.phone::before{content:"";position:absolute;top:18px;left:50%;width:82px;height:22px;margin-left:-41px;background:var(--device);border-radius:12px;z-index:6}
.screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:#000}

/* sections */
.sec{padding-block:88px}
.band{background:var(--bg2)}
.sec-head{display:grid;gap:14px;margin-bottom:44px;max-width:760px}
@media (max-width:700px){.sec{padding-block:64px}.sec-head{margin-bottom:32px}}

/* how */
ol.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
ol.flow li{position:relative;display:grid;gap:10px;align-content:start}
.num{width:44px;height:44px;border-radius:12px;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:19px;background:var(--bg2);position:relative;z-index:1;transform:rotate(-6deg)}
ol.flow li:not(:last-child)::after{content:"";position:absolute;top:22px;left:58px;right:-16px;border-top:2px dashed var(--line)}
ol.flow p{color:var(--muted);font-size:15px}
.benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:64px}
.benefit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:10px;align-content:start}
.benefit .ib{width:44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.benefit p{color:var(--muted);font-size:15px}
.subhead{margin-top:64px;margin-bottom:-40px}
@media (max-width:980px){ol.flow,.benefits{grid-template-columns:repeat(2,minmax(0,1fr))}ol.flow li:nth-child(2)::after{display:none}}
@media (max-width:560px){ol.flow,.benefits{grid-template-columns:1fr}ol.flow li::after{display:none}}

/* templates */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:8px 15px;border-radius:999px;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chipbtn .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipbtn[aria-pressed="true"] .n{color:inherit;opacity:.7}
.tgrid{display:grid;gap:30px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1160px){.tgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tcard{display:flex;flex-direction:column;gap:12px;min-width:0}
.poster{position:relative;display:block;width:100%;aspect-ratio:3/4;border:0;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);background:var(--surface2);transition:transform .25s}
.poster:hover{transform:translateY(-3px)}
.poster .pv{position:absolute;left:0;top:0;width:300px;height:620px;transform:scale(var(--k,.6));transform-origin:0 0;pointer-events:none}
.poster .play{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.poster .play .ico{width:15px;height:15px}
.poster .play .s{fill:var(--acc)}
.badge{position:absolute;top:10px;left:10px;padding:4px 9px;border-radius:6px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700;letter-spacing:.04em}
.tmeta{display:grid;gap:2px;min-width:0}
.tmeta h3{font-size:18px}
.tmeta .k{font-size:13px;color:var(--muted)}
.tcard[hidden]{display:none}

/* custom */
.custom-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.cases{display:grid;gap:14px}
.case{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.case .ib{grid-row:span 3;width:46px;height:46px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.case p{color:var(--muted);font-size:15px}
.case .price{font-weight:700;font-size:14px;color:var(--ink)}
ol.proc{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:0}
ol.proc li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 16px;padding-bottom:22px;position:relative}
ol.proc li:not(:last-child)::before{content:"";position:absolute;left:21px;top:46px;bottom:4px;border-left:2px dashed var(--line)}
ol.proc .num{grid-row:span 2;background:var(--bg)}
ol.proc p{color:var(--muted);font-size:15px}
@media (max-width:900px){.custom-grid{grid-template-columns:1fr;gap:36px}}

/* pricing */
.bill{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin-bottom:30px;flex-wrap:wrap}
.bill button{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.bill button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bill .save{font-size:12px;color:var(--gold);font-weight:700;padding:0 10px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.tier{position:relative;display:flex;flex-direction:column;gap:16px;padding:26px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.tier.rec{border:2px solid var(--acc);padding:25px}
.tier .rec-b{position:absolute;top:-12px;left:24px;background:var(--acc);color:var(--acc-ink);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.03em}
.tier .for{font-size:14px;color:var(--muted);min-height:2.6em}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:var(--f-disp);font-stretch:72%;font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:14px}
.tier .yr{font-size:12.5px;color:var(--muted);margin-top:-8px;min-height:1.4em}
.tier ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15px}
.tier li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start}
.tier li .ico{width:18px;height:18px;color:var(--acc);margin-top:3px}
.tier .btn{margin-top:auto}
.founding{margin-top:22px;display:flex;gap:16px;align-items:center;padding:18px 20px;border:2px dashed color-mix(in srgb,var(--acc) 55%,var(--line));border-radius:var(--r);background:var(--surface)}
.founding .ico{width:30px;height:30px;color:var(--acc)}
.founding b{display:block}
.founding p{color:var(--muted);font-size:15px}
.alc{margin-top:56px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}
.menu-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.menu-list li{display:flex;align-items:baseline;gap:10px}
.menu-list .nm{min-width:0}
.menu-list .dots{flex:1;min-width:24px;border-bottom:2px dotted var(--line);transform:translateY(-5px)}
.menu-list .pr{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:900px){.tiers{grid-template-columns:1fr}.alc{grid-template-columns:1fr;gap:20px}.tier .for{min-height:0}}

/* faq */
.faq{max-width:820px;display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 20px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;font-weight:700}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .2s;color:var(--muted)}
.faq details[open] summary .ico{transform:rotate(45deg)}
.faq details p{padding:0 0 18px;color:var(--ink2);max-width:66ch}

/* request */
.req-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:start}
.contact{margin-top:28px;display:grid;gap:14px}
.contact div{display:flex;gap:12px;align-items:center}
.contact .ico{color:var(--gold)}
.contact .val{font-weight:700;user-select:all;word-break:break-all}
.nextl{margin-top:30px;display:grid;gap:12px;list-style:none;padding:0}
.nextl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;color:var(--ink2);font-size:15px}
.nextl .ico{width:19px;height:19px;color:var(--acc);margin-top:2px}
.slip{position:relative;background:var(--surface);border-radius:18px;padding:34px 28px 28px;box-shadow:var(--shadow)}
.slip::before{content:"";position:absolute;left:18px;right:18px;top:16px;border-top:2px dashed var(--line)}
.slip::after{content:"";position:absolute;left:-1px;right:-1px;top:6px;height:20px;background:radial-gradient(circle at 0 50%,var(--bg) 9px,transparent 10px) left/50% 100% no-repeat,radial-gradient(circle at 100% 50%,var(--bg) 9px,transparent 10px) right/50% 100% no-repeat}
.slip-no{position:absolute;top:30px;right:28px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field legend{font-size:13.5px;font-weight:700;color:var(--ink2);padding:0}
.field .opt{font-weight:400;color:var(--muted)}
fieldset.field{border:0;margin:0;padding:0}
input,select,textarea{font:inherit;font-size:15.5px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.field.bad input{border-color:var(--acc)}
.err{font-size:12.5px;color:var(--acc);min-height:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:14.5px;font-weight:600;color:var(--ink2)}
.seg .ico{width:17px;height:17px}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.form-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:22px}
.result{margin-top:4px;display:grid;gap:14px}
.result h3{display:flex;align-items:center;gap:10px}
.result h3 .ico{color:var(--acc);width:26px;height:26px}
.result pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:14px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:260px;overflow:auto}
.result .row{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:900px){.req-grid{grid-template-columns:1fr;gap:36px}}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.slip{padding:34px 18px 22px}.slip-no{right:18px}}

/* footer */
footer{border-top:1px solid var(--line);padding-block:36px 44px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:flex-start}
footer nav{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
footer nav a{text-decoration:none;color:var(--ink2)}
footer .fine{margin-top:8px;max-width:46ch}

/* dialog */
dialog.dlg{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(940px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
dialog.dlg::backdrop{background:var(--scrim);backdrop-filter:blur(3px)}
.dlg-in{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;padding:28px;align-items:start}
.dlg-x{position:absolute;top:14px;right:14px;z-index:3}
.dlg-info{display:grid;gap:14px;padding-top:8px;min-width:0}
.dlg-info h4{margin:10px 0 0;font-size:13px;letter-spacing:.1em;color:var(--gold)}
.dlg-info ol,.dlg-info ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink2);font-size:15px}
.dlg-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
@media (max-width:760px){.dlg-in{grid-template-columns:1fr;justify-items:center;padding:56px 14px 22px;gap:22px}.dlg-info{justify-self:stretch}}

/* ============ invite engine (inside the phone) ============ */
.scr{position:absolute;inset:0;background:var(--ibg);color:var(--iink);font-family:var(--f-body);overflow:hidden;line-height:1.5;text-align:center}
.scr::before{content:"";position:absolute;inset:0;background-image:var(--ipat);opacity:var(--ipo);pointer-events:none}
.scr::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% -4%,color-mix(in srgb,var(--iacc) 30%,transparent),transparent 42%);pointer-events:none}
.scr-in{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;padding:50px 18px 22px;display:flex;flex-direction:column;scrollbar-width:none}
.scr-in::-webkit-scrollbar{display:none}
.i-step{margin-block:auto;animation:irise .55s cubic-bezier(.2,.8,.2,1)}
@keyframes irise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pv .i-step{margin-top:0;animation:none}
.pv .scr-in{padding-top:44px}
.i-kick{font-size:11px;letter-spacing:.26em;color:var(--iacc2);font-family:var(--ikick,inherit);font-weight:700}
.i-h1{font-family:var(--idisp);font-stretch:var(--istr);font-weight:800;font-size:38px;line-height:1.15;margin:8px 0 6px}
.i-h2{font-family:var(--idisp);font-stretch:var(--istr);font-weight:800;font-size:22px;line-height:1.32;margin:8px 0;text-wrap:balance}
.i-lead{font-size:13.5px;line-height:1.6;color:var(--imut);margin:0}
.i-dots{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.i-dots i{width:18px;height:3px;border-radius:2px;background:var(--iline)}
.i-dots i.a{background:var(--iacc)}
.i-btn{border:0;cursor:pointer;padding:12px 24px;border-radius:999px;font-weight:700;font-size:14.5px;background:var(--iacc);color:var(--ion);box-shadow:0 10px 22px -8px color-mix(in srgb,var(--iacc) 80%,transparent);transition:transform .15s,opacity .2s}
.i-btn:active{transform:scale(.96)}
.i-btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.i-btn.ghost{background:transparent;color:var(--iacc2);border:1px solid color-mix(in srgb,var(--iacc2) 55%,transparent);box-shadow:none;padding:10px 18px;font-size:13px}
.i-btn.i-no{background:transparent;color:var(--iink);border:1px solid var(--iline);box-shadow:none}
.i-no.flee{position:absolute;z-index:5;transition:left .22s,top .22s,transform .22s}
.i-row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px;min-height:48px}
.i-yes{transition:transform .2s}
.i-hint{font-size:12px;color:var(--imut);margin:0}
.i-hint i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--iacc);margin-right:8px;vertical-align:middle;animation:pulse 1.4s infinite}
.i-msg{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--iacc2)}
.i-belt{position:relative;margin:16px -18px 0;height:74px;overflow:hidden;background:var(--is);border-block:2px solid var(--iline)}
.i-belt::before,.i-belt::after{content:"";position:absolute;top:0;bottom:0;width:26px;z-index:2}
.i-belt::before{left:0;background:linear-gradient(90deg,var(--is),transparent)}
.i-belt::after{right:0;background:linear-gradient(-90deg,var(--is),transparent)}
.i-track{display:flex;gap:12px;position:absolute;top:7px;left:0;padding-left:12px;animation:irun 20s linear infinite;width:max-content}
@keyframes irun{to{transform:translateX(-50%)}}
.i-dish{width:56px;height:56px;border-radius:50%;background:var(--ipaper);display:grid;place-items:center;flex-shrink:0;color:var(--ipink);box-shadow:inset 0 0 0 4px var(--ipaper),inset 0 0 0 6px var(--iacc)}
.i-dish .ico{width:30px;height:30px}
.i-list{display:flex;flex-direction:column;gap:7px;margin-top:12px;text-align:left}
.i-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:14px;background:var(--is);border:1px solid var(--iline);color:var(--iink);cursor:pointer;text-align:left;position:relative;transition:border-color .2s,background-color .2s}
.i-item .ic{width:42px;height:42px;border-radius:11px;background:var(--is2);display:grid;place-items:center;flex-shrink:0;color:var(--iacc2)}
.i-item .ic .ico{width:26px;height:26px}
.i-item .tx{flex:1;min-width:0}
.i-item b{display:block;font-family:var(--idisp);font-size:13.5px;line-height:1.3}
.i-item small{display:block;font-size:11px;color:var(--imut);line-height:1.4;margin-top:2px}
.i-item .pc{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--is2);color:var(--imut);white-space:nowrap}
.i-item.sel{border-color:var(--iacc);background:color-mix(in srgb,var(--iacc) 14%,var(--is))}
.i-item .ck{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--iacc);color:var(--ion);display:none;place-items:center}
.i-item .ck .ico{width:13px;height:13px;stroke-width:2.6}
.i-item.sel .ck{display:grid}
.i-item.shake,.i-obj.shake{animation:ishake .5s}
@keyframes ishake{20%,60%{transform:translateX(-5px) rotate(-3deg)}40%,80%{transform:translateX(5px) rotate(3deg)}}
.i-tray{display:flex;gap:7px;justify-content:center;margin-top:12px}
.i-slot{width:38px;height:38px;border-radius:10px;border:1px dashed var(--iline);display:grid;place-items:center;color:var(--iacc2)}
.i-slot.f{border:1px solid var(--iacc);background:color-mix(in srgb,var(--iacc) 14%,transparent);animation:ipop .3s}
.i-slot .ico{width:22px;height:22px}
@keyframes ipop{0%{transform:scale(.6)}70%{transform:scale(1.12)}}
.i-count{font-size:12px;color:var(--imut);margin-top:6px;min-height:18px}
.i-obj{width:118px;height:118px;border-radius:50%;margin:16px auto 8px;display:grid;place-items:center;background:var(--is);border:2px solid var(--iacc);color:var(--iacc);cursor:pointer;--f:color-mix(in srgb,var(--iacc) 28%,transparent)}
.i-obj .ico{width:60px;height:60px;stroke-width:1.3}
.i-obj.done{width:64px;height:64px;cursor:default;margin:10px auto 0}
.i-obj.done .ico{width:32px;height:32px}
.i-card{margin:14px auto 0;background:var(--ipaper);color:var(--ipink);border-radius:8px;padding:16px 16px 18px;box-shadow:0 16px 30px -12px rgba(0,0,0,.5);animation:iunroll .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes iunroll{from{transform:scaleY(.1);opacity:0}to{transform:none;opacity:1}}
.i-card .big{font-family:var(--ibig,var(--idisp)),Georgia,serif;font-weight:800;font-size:30px;color:var(--iaccp);line-height:1.15}
.i-card .lbl{font-size:10px;letter-spacing:.16em;color:color-mix(in srgb,var(--ipink) 58%,transparent);margin:6px 0 8px;font-weight:700}
.i-card p{font-family:var(--idisp);font-weight:700;font-size:14.5px;line-height:1.55;margin:0}
.i-tk{position:relative;margin-top:14px;background:var(--ipaper);color:var(--ipink);border-radius:14px;overflow:hidden;text-align:left;box-shadow:0 24px 40px -16px rgba(0,0,0,.55)}
.i-tk-top{background:var(--is);color:var(--iink);padding:16px 16px 14px;position:relative;border-bottom:2px dashed var(--iline)}
.i-brand{font-family:var(--idisp);font-stretch:78%;font-weight:800;font-size:20px;letter-spacing:.1em;line-height:1.2}
.i-sub{font-size:10px;letter-spacing:.12em;color:var(--imut);margin-top:3px}
.i-n{position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--ibg)}
.i-n.l{left:-10px}.i-n.r{right:-10px}
.i-tk-body{padding:16px 16px 16px;position:relative}
.i-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.i-f{min-width:0}
.i-f label{display:block;font-size:9px;letter-spacing:.14em;color:color-mix(in srgb,var(--ipink) 58%,transparent);margin-bottom:2px;font-weight:700}
.i-f div{font-family:var(--idisp);font-weight:800;font-size:13px;line-height:1.3}
.i-f.big div{font-size:16px;color:var(--iaccp)}
.i-picks{margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ipink) 16%,transparent)}
.i-picks label{display:block;font-size:9px;letter-spacing:.14em;color:color-mix(in srgb,var(--ipink) 58%,transparent);margin-bottom:6px;font-weight:700}
.i-chip{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--ipink) 8%,transparent);border-radius:99px;padding:3px 9px 3px 3px;margin:0 4px 4px 0;font-size:11.5px;font-weight:700}
.i-chip span{width:22px;height:22px;border-radius:50%;background:var(--is);color:var(--iacc2);display:grid;place-items:center}
.i-chip .ico{width:14px;height:14px}
.i-luck{font-size:11.5px;margin:6px 0 0;padding-right:72px;min-height:44px;font-family:var(--idisp);color:color-mix(in srgb,var(--ipink) 78%,transparent)}
.i-stamp{position:absolute;right:10px;bottom:10px;width:74px;height:74px;border:3px solid var(--iaccp);color:var(--iaccp);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg) scale(2.3);opacity:0;pointer-events:none;mix-blend-mode:multiply;text-align:center;padding:4px}
.i-stamp.round{border-radius:50%;box-shadow:inset 0 0 0 3px var(--ipaper),inset 0 0 0 4.5px var(--iaccp)}
.i-stamp b{font-family:var(--ibig,var(--idisp)),Georgia,serif;font-weight:800;font-size:var(--sz,21px);line-height:1}
.i-stamp small{font-size:7.5px;font-weight:800;margin-top:5px;letter-spacing:.05em}
.i-stamp.on{animation:istamp .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes istamp{to{transform:rotate(-12deg) scale(1);opacity:.92}}
.i-cd{display:flex;gap:6px;justify-content:center;margin-top:16px}
.i-cd div{background:var(--is);border:1px solid var(--iline);border-radius:10px;width:58px;padding:7px 0}
.i-cd b{display:block;font-family:var(--idisp);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.i-cd span{font-size:10px;color:var(--imut)}
.i-sign{margin-top:14px;font-family:var(--idisp);font-size:13.5px;line-height:1.6;color:var(--imut)}
.i-sign em{font-style:normal;color:var(--iacc2)}
.i-after{animation:irise .5s}
.i-fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.i-fx span{position:absolute;top:-14px;width:9px;height:7px;animation:ifall linear forwards}
.i-fx span.petal{border-radius:10px 0 10px 0}
.i-fx span.dot{border-radius:50%;width:6px;height:6px}
@keyframes ifall{to{transform:translate(var(--dx),660px) rotate(var(--rot));opacity:.2}}

/* openers */
.op{position:relative;display:block;width:210px;height:200px;margin:18px auto 14px;background:none;border:0;padding:0;cursor:pointer;perspective:700px;color:inherit}
.op-behind{position:absolute;inset:14px 8px 0;border-radius:10px;background:radial-gradient(circle at 50% 40%,var(--is2),var(--ibg));display:flex;align-items:center;justify-content:center;gap:8px;color:var(--iacc2)}
.op-behind .ico{width:58px;height:58px;stroke-width:1.3;--f:color-mix(in srgb,var(--iacc) 35%,transparent)}
.op-rod{position:absolute;top:0;left:-8px;right:-8px;height:9px;border-radius:5px;background:var(--iacc2);z-index:3}
.op-flap{position:absolute;top:5px;width:50%;height:165px;background:var(--iflap);color:var(--iflapink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:2;transition:transform 1s cubic-bezier(.6,.05,.2,1);border:1px solid color-mix(in srgb,var(--iflapink) 18%,transparent)}
.op-flap.l{left:0;transform-origin:left top;border-radius:0 0 0 6px}
.op-flap.r{right:0;transform-origin:right top;border-radius:0 0 6px 0}
.op-flap b{font-family:var(--iglyph);font-size:46px;font-weight:800;line-height:1}
.op-flap small{font-size:9.5px;letter-spacing:.2em;opacity:.8;font-weight:700}
.op.open .op-flap.l{transform:rotateY(-84deg) skewY(4deg)}
.op.open .op-flap.r{transform:rotateY(84deg) skewY(-4deg)}
.op-doors .op-rod{height:12px;border-radius:3px;left:-6px;right:-6px}
.op-doors .op-flap{top:10px;height:190px;border-radius:2px;box-shadow:inset 0 0 0 7px color-mix(in srgb,#000 22%,transparent),inset 0 0 0 8px color-mix(in srgb,var(--iacc2) 55%,transparent)}
.op-doors .op-flap::after{content:"";position:absolute;top:52%;width:6px;height:6px;border-radius:50%;background:var(--iacc2)}
.op-doors .op-flap.l::after{right:12px}
.op-doors .op-flap.r::after{left:12px}
.op-doors .op-behind{inset:10px 0 0;border-radius:2px}
.op-env{height:196px}
.env-back{position:absolute;left:0;right:0;bottom:0;height:132px;background:color-mix(in srgb,var(--is2) 80%,var(--iink));border-radius:6px}
.env-letter{position:absolute;left:14px;right:14px;bottom:10px;height:112px;background:var(--ipaper);color:var(--ipink);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px;gap:2px;transition:transform .8s .35s cubic-bezier(.2,.8,.2,1);z-index:1}
.env-letter small{font-size:9px;letter-spacing:.18em;opacity:.65;font-weight:700}
.env-letter b{font-family:var(--idisp);font-size:21px}
.env-front{position:absolute;left:0;right:0;bottom:0;height:132px;background:var(--is2);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:2}
.env-flap{position:absolute;left:0;right:0;bottom:0;height:132px;background:color-mix(in srgb,var(--is2) 88%,var(--iink));clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:50% 0;transition:transform .6s ease,z-index 0s .3s;z-index:3}
.env-seal{position:absolute;left:calc(50% - 21px);bottom:31px;width:42px;height:42px;border-radius:50%;background:var(--iacc);color:var(--ion);display:grid;place-items:center;font-family:var(--iglyph);font-weight:800;font-size:19px;z-index:4;transition:transform .3s,opacity .3s;box-shadow:0 0 0 3px color-mix(in srgb,var(--iacc) 55%,transparent),0 4px 10px rgba(0,0,0,.3)}
.op.open .env-flap{transform:rotateX(180deg);z-index:0}
.op.open .env-letter{transform:translateY(-78px)}
.op.open .env-seal{transform:scale(.2);opacity:0}
.op-box{height:196px}
.bx-base{position:absolute;left:22px;right:22px;bottom:0;height:112px;background:var(--ibox);border-radius:6px;z-index:1}
.bx-lid{position:absolute;left:14px;right:14px;bottom:104px;height:42px;background:var(--iflap);color:var(--iflapink);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;transition:transform .85s cubic-bezier(.3,.7,.2,1),opacity .85s;line-height:1.1}
.bx-lid b{font-family:var(--idisp);font-weight:800;font-size:17px}
.bx-lid small{font-size:9px;letter-spacing:.12em;opacity:.8;font-weight:700}
.bx-in{position:absolute;left:50%;bottom:46px;width:96px;height:96px;margin-left:-48px;display:grid;place-items:center;color:var(--iacc2);z-index:2;transform:translateY(40px) scale(.6);opacity:0;transition:transform .7s .3s cubic-bezier(.2,.9,.3,1.3),opacity .5s .3s}
.bx-in .ico{width:84px;height:84px;stroke-width:1.2;--f:color-mix(in srgb,var(--iacc) 40%,transparent)}
.op.open .bx-lid{transform:translateY(-80px) rotate(-16deg);opacity:0}
.op.open .bx-in{transform:none;opacity:1}
.v-pizza .bx-base{height:58px;left:6px;right:6px;background:var(--ibox);box-shadow:inset 0 -6px 0 color-mix(in srgb,#000 12%,transparent)}
.v-pizza .bx-lid{left:6px;right:6px;bottom:52px;height:84px;border-radius:4px;border:2px solid color-mix(in srgb,var(--iflapink) 40%,transparent);transform-origin:50% 100%}
.v-pizza .bx-lid b{font-size:24px;font-style:italic}
.v-pizza .bx-in{bottom:20px}
.v-pizza.open .bx-lid{transform:translateY(-34px) rotateX(70deg);opacity:0}
.v-cloche .bx-base{height:16px;left:0;right:0;border-radius:50%;background:var(--ipaper);bottom:8px}
.v-cloche .bx-lid{left:18px;right:18px;bottom:18px;height:118px;border-radius:120px 120px 8px 8px;background:linear-gradient(155deg,color-mix(in srgb,var(--iink) 92%,transparent),color-mix(in srgb,var(--iink) 40%,var(--ibg)));color:var(--ipink)}
.v-cloche .bx-lid::before{content:"";position:absolute;top:-12px;left:50%;width:24px;height:14px;margin-left:-12px;border-radius:12px 12px 2px 2px;background:color-mix(in srgb,var(--iink) 85%,transparent)}
.v-cloche .bx-in{bottom:20px}
.v-gift .bx-base,.v-gift .bx-lid{background-image:linear-gradient(90deg,transparent 44%,var(--iacc2) 44%,var(--iacc2) 56%,transparent 56%)}
.v-gift .bx-lid b{position:relative;z-index:1;background:var(--iflap);padding:0 6px;border-radius:4px;font-size:20px}
.v-gift .bx-lid::before{content:"";position:absolute;top:-16px;left:50%;width:34px;height:20px;margin-left:-17px;border:4px solid var(--iacc2);border-radius:50% 50% 0 0}
.v-ring .bx-base{left:52px;right:52px;height:66px;border-radius:12px 12px 18px 18px}
.v-ring .bx-lid{left:46px;right:46px;bottom:60px;height:40px;border-radius:20px 20px 6px 6px}
.v-ring .bx-in{bottom:52px}
.v-ring .bx-in .ico{width:70px;height:70px}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .i-fx{display:none}
}

const mt = s => String(s).replace(/[ა-ჺჽ-ჿ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xBC0));
const caps = s => lang === 'ka' ? mt(s) : s;
const fill = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);

function demoDate(t){

}

/* ---------- live invite instance ---------- */
const invites = [];
class Invite {
  constructor(el, id){
    this.el = el; this.timers = [];
    el.addEventListener('click', e => this.onClick(e));
    el.addEventListener('pointerover', e => { const b = e.target.closest('.i-no'); if (b && e.pointerType === 'mouse') this.flee(b); });
    el.addEventListener('touchstart', e => { const b = e.target.closest('.i-no'); if (b){ e.preventDefault(); this.flee(b); } }, {passive:false});
    invites.push(this);
    this.set(id);
  }
  set(id){ this.t = TBY[id]; this.reset(); }
  reset(){ this.clear(); this.s = {step:0, picks:[], fortune:-1, stamped:false, tries:0}; this.render(); }
  clear(){ this.timers.forEach(clearTimeout); this.timers = []; }
  later(fn, ms){ this.timers.push(setTimeout(fn, ms)); }
  render(){
    const t = this.t, s = this.s;
    const views = [() => vCover(t, false), () => vAsk(t), () => vPick(t, s), () => vSurprise(t, s), () => vTicket(t, s)];
    this.el.innerHTML = '<div class="scr" style="'+tvars(t)+'"><div class="scr-in">'+views[s.step]()+'</div><div class="i-fx"></div></div>';
    this.inner = this.el.querySelector('.scr-in');
    if (s.step === 2) this.tray();
    tick();
  }
  go(n){ this.s.step = n; this.render(); if (this.inner) this.inner.scrollTop = 0; }
  onClick(e){
    const b = e.target.closest('[data-act]'); if (!b || !this.el.contains(b)) return;
    const a = b.dataset.act, s = this.s;
    if (a === 'open'){ if (b.classList.contains('open')) return; b.classList.add('open'); this.later(() => this.go(1), reduced() ? 50 : 1050); }
    else if (a === 'yes'){ this.burst(36); this.later(() => this.go(2), 380); }
    else if (a === 'no'){ this.flee(b); }
    else if (a === 'pick'){ this.pick(+b.dataset.i, b); }
    else if (a === 'next'){ if (s.step === 2 && !s.picks.length) return; this.go(s.step + 1); }
    else if (a === 'reveal'){ b.classList.add('shake'); this.later(() => { s.fortune = Math.floor(Math.random() * tx(this.t.sp.lines).length); this.render(); this.burst(18); }, 520); }
    else if (a === 'stamp'){ s.stamped = true; this.render(); this.later(() => this.burst(40), 380); }
    else if (a === 'again'){ this.reset(); }
  }
  flee(b){
    const lines = tx(this.t.noLines), s = this.s;
    s.tries++;
    const msg = this.el.querySelector('.i-msg'), yes = this.el.querySelector('.i-yes');
    if (msg) msg.textContent = lines[Math.min(s.tries - 1, lines.length - 1)];
    if (yes) yes.style.transform = 'scale(' + (1 + s.tries * .1) + ')';
    if (s.tries >= lines.length){ b.hidden = true; return; }
    const box = this.inner, r = b.getBoundingClientRect(), br = box.getBoundingClientRect();
    const w = r.width, h = r.height, W = box.clientWidth, H = box.clientHeight;
    b.classList.add('flee');
    b.style.left = Math.round(8 + Math.random() * Math.max(0, W - w - 16)) + 'px';
    b.style.top = Math.round(box.scrollTop + 60 + Math.random() * Math.max(0, H - h - 90)) + 'px';
    b.style.transform = 'rotate(' + (Math.random() * 26 - 13) + 'deg) scale(' + Math.max(.6, 1 - s.tries * .1) + ')';
    void br;
  }
  pick(i, b){
    const s = this.s, at = s.picks.indexOf(i);
    if (at > -1) s.picks.splice(at, 1);
    else if (s.picks.length < this.t.max) s.picks.push(i);
    else {
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      const c = this.el.querySelector('.i-count'); if (c) c.textContent = fill(G[lang].max, {m:this.t.max});
      return;
    }
    b.classList.toggle('sel', s.picks.includes(i)); b.setAttribute('aria-pressed', s.picks.includes(i));
    this.tray();
  }
  tray(){
    const s = this.s, t = this.t;
    let h = '';
    for (let k = 0; k < t.max; k++){ const x = t.items[s.picks[k]]; h += x ? '<div class="i-slot f"'+fcol(x.col)+'>'+ic(x.ic)+'</div>' : '<div class="i-slot"></div>'; }
    const tr = this.el.querySelector('.i-tray'); if (tr) tr.innerHTML = h;
    const c = this.el.querySelector('.i-count'); if (c) c.textContent = fill(G[lang].count, {n:s.picks.length, m:t.max});
    const n = this.el.querySelector('[data-act="next"]'); if (n) n.disabled = !s.picks.length;
  }
  burst(n){
    if (reduced()) return;
    const fx = this.el.querySelector('.i-fx'); if (!fx) return;
    const t = this.t, cols = t.fxc || [t.c.acc, t.c.acc2, t.c.paper];
    for (let i = 0; i < n; i++){
      const p = document.createElement('span');
      p.className = t.fx || 'rect';
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = cols[i % cols.length];
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      p.style.animationDelay = (Math.random() * .5) + 's';
      fx.appendChild(p);
      setTimeout(() => p.remove(), 3600);
    }
  }
}

/* countdowns: one ticker for every open ticket */
function tick(){
  $$('[data-cd]').forEach(el => {
    const left = Math.max(0, +el.dataset.cd - Date.now());
    if (!left){ el.innerHTML = '<p class="i-sign"><em>'+esc(G[lang].now)+'</em></p>'; el.removeAttribute('data-cd'); return; }
    const sec = Math.floor(left / 1000), v = [Math.floor(sec / 86400), Math.floor(sec % 86400 / 3600), Math.floor(sec % 3600 / 60), sec % 60];
    el.querySelectorAll('b').forEach((b, i) => { b.textContent = v[i]; });
  });
}
setInterval(tick, 1000);

  $('#tgrid').innerHTML = TPL.map(t =>
    '<article class="tcard" data-cat="'+t.cat+'"'+(filter!=='all' && filter!==t.cat ? ' hidden' : '')+'>'+
      '<button type="button" class="poster" data-demo="'+t.id+'" aria-label="'+esc(D.ui.play+': '+tx(t.name))+'" style="background:'+t.c.bg+'">'+
        '<div class="pv">'+coverHTML(t)+'</div>'+
        (t.original ? '<span class="badge">'+esc(D.tpl.original)+'</span>' : '')+
        '<span class="play">'+ic('play')+esc(D.ui.play)+'</span></button>'+
      '<div class="tmeta"><h3>'+esc(tx(t.name))+'</h3><span class="k">'+esc(tx(t.kind))+'</span></div></article>').join('');
  scalePosters();
}
const ro = ('ResizeObserver' in window) ? new ResizeObserver(es => es.forEach(e => e.target.style.setProperty('--k', (e.contentRect.width / 300).toFixed(4)))) : null;
function scalePosters(){
  $$('.poster').forEach(p => { if (ro) ro.observe(p); else p.style.setProperty('--k', (p.clientWidth / 300).toFixed(4)); });
}

function renderCustom(){
  const D = S[lang];
  $('#proc').innerHTML = D.cus.proc.map((p, i) => '<li><span class="num">'+(i+1)+'</span><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p></li>').join('');
  $('#cases').innerHTML = D.cus.cases.map(c =>
    '<div class="case"><span class="ib">'+ic(c[0])+'</span><h3>'+esc(c[1])+'</h3><p>'+esc(c[2])+'</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px"><span class="price">'+esc(c[3])+'</span>'+
    '<button type="button" class="btn ghost small" data-req="'+c[4]+'" data-who="'+c[5]+'"><span>'+esc(D.nav.cta)+'</span>'+ic('arrowR')+'</button></div></div>').join('');
}

let billing = store.get('bill') === 'y' ? 'y' : 'm';
function renderPricing(){
  const D = S[lang].pr;
  $$('#bill [data-bill]').forEach(b => b.setAttribute('aria-pressed', b.dataset.bill === billing));
  $('#tiers').innerHTML = D.tiers.map(t => {
    const p = billing === 'y' ? Math.round(t.price * 10 / 12) : t.price;
    return '<div class="tier'+(t.rec?' rec':'')+'">'+(t.rec?'<span class="rec-b">'+esc(D.rec)+'</span>':'')+
      '<div><h3 class="disp" style="font-size:26px">'+esc(t.name)+'</h3><p class="for">'+esc(t.for)+'</p></div>'+
      '<div class="price"><b>'+p+'</b><span>'+esc(D.per)+'</span></div>'+
      '<p class="yr">'+esc(billing === 'y' ? fill(D.yr, {x:(t.price * 10).toLocaleString('en-US')}) : D.mo)+'</p>'+
      '<ul>'+t.f.map(f => '<li>'+ic('check')+'<span>'+esc(f)+'</span></li>').join('')+'</ul>'+
      '<button type="button" class="btn '+(t.rec?'primary':'ghost')+'" data-req="'+t.id+'" data-who="restaurant"><span>'+esc(D.choose)+'</span>'+ic('arrowR')+'</button></div>';
  }).join('');
  $('#alc').innerHTML = D.alc.map(a => '<li><span class="nm">'+esc(a[0])+'</span><span class="dots"></span><span class="pr">'+esc(a[1])+'</span></li>').join('');
}

function renderFaq(){
  $('#faqList').innerHTML = S[lang].faq.list.map((q, i) => '<details'+(i===0?' open':'')+'><summary>'+esc(q[0])+ic('plus')+'</summary><p>'+esc(q[1])+'</p></details>').join('');
}

function renderForm(){
  const F = S[lang].f;
  const who = (document.querySelector('input[name="who"]:checked') || {}).value || 'restaurant';
  $('#whoSeg').innerHTML = F.whoOpts.map(o => '<label><input type="radio" name="who" id="who-'+o[0]+'" value="'+o[0]+'"'+(o[0]===who?' checked':'')+'><span>'+ic(o[1])+esc(o[2])+'</span></label>').join('');
  const keep = (id, opts) => { const el = $(id), v = el.value; el.innerHTML = opts; if (v) el.value = v; };
  keep('#fType', F.types.map(o => '<option value="'+o[0]+'">'+esc(o[1])+'</option>').join(''));
  keep('#fTpl', '<option value="">'+esc(F.tplNone)+'</option>' + TPL.map(t => '<option value="'+t.id+'">'+esc(tx(t.name)+' · '+tx(t.kind))+'</option>').join(''));
  keep('#fBudget', F.budgets.map(o => '<option value="'+o[0]+'">'+esc(o[1])+'</option>').join(''));
  $('#nextl').innerHTML = S[lang].req.next.map(n => '<li>'+ic('check')+'<span>'+esc(n)+'</span></li>').join('');
  $('#slipNo').textContent = F.slip + ' ' + slipNo;
  if (!$('#result').hidden && lastReq) showResult(lastReq.mode);
}

function renderAll(){
  applyStatic(); renderHero(); renderHow(); renderTemplates(); renderCustom(); renderPricing(); renderFaq(); renderForm();
  invites.forEach(i => i.render());
  if (dlg.open && dlgInv) fillDialog(dlgInv.t);
}

/* ---------- theme ---------- */
function effTheme(){
  const a = document.documentElement.getAttribute('data-theme');
  if (a === 'dark' || a === 'light') return a;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function themeIcon(){
  const b = $('#themeBtn'); b.innerHTML = ic(effTheme() === 'dark' ? 'sun' : 'moon'); b.setAttribute('aria-label', S[lang].ui.theme);
}
const savedTheme = store.get('theme');
if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
$('#themeBtn').addEventListener('click', () => {
  const next = effTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next); store.set('theme', next); themeIcon();
});
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon);

/* ---------- language ---------- */
$$('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; store.set('lang', lang); renderAll(); }));

/* ---------- mobile nav ---------- */
$('#menuBtn').innerHTML = ic('menu');
$('#menuBtn').addEventListener('click', () => {
  const open = !$('#mnav').classList.contains('open');
  $('#mnav').classList.toggle('open', open); $('#menuBtn').setAttribute('aria-expanded', open);
  $('#menuBtn').innerHTML = ic(open ? 'close' : 'menu');
});
$$('#mnav a').forEach(a => a.addEventListener('click', () => { $('#mnav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', false); $('#menuBtn').innerHTML = ic('menu'); }));

/* ---------- hero invite ---------- */
const heroInv = new Invite($('#heroPhone'), 'omakase');
$('#heroSw').addEventListener('click', e => {
  const b = e.target.closest('[data-sw]'); if (!b) return;
  heroInv.set(b.dataset.sw);
  $$('#heroSw [data-sw]').forEach(x => x.setAttribute('aria-pressed', x === b));
});

/* ---------- filters + demo dialog ---------- */
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f;
  $$('#filters [data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
  $$('#tgrid .tcard').forEach(c => { c.hidden = !(filter === 'all' || c.dataset.cat === filter); });
});
const dlg = $('#dlg');
let dlgInv = null;
function fillDialog(t){
  const D = S[lang];
  $('#dlgKind').textContent = caps(tx(t.kind));
  $('#dlgTitle').textContent = tx(t.name);
  $('#dlgDesc').textContent = tx(t.desc);
  $('#dlgSteps').innerHTML = [tx(t.hint), tx(t.q), tx(t.pickT), tx(t.sp.title), tx(t.tk.title) || G[lang].tk].map(x => '<li>'+esc(x)+'</li>').join('');
  $('#dlgCustom').innerHTML = D.dlg.customList.map(x => '<li>'+esc(x)+'</li>').join('');
}
$('#tgrid').addEventListener('click', e => {
  const b = e.target.closest('[data-demo]'); if (!b) return;
  const t = TBY[b.dataset.demo];
  if (!dlgInv) dlgInv = new Invite($('#dlgPhone'), t.id); else dlgInv.set(t.id);
  fillDialog(t);
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
});
$('#dlgX').innerHTML = ic('close');
$('#dlgX').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { if (dlgInv) dlgInv.clear(); });
$('#dlgRestart').addEventListener('click', () => dlgInv && dlgInv.reset());
$('#dlgReq').addEventListener('click', () => {
  const t = dlgInv.t; dlg.close();
  requestFor(t.cat === 'restaurant' ? 'plan-main' : (t.cat === 'life' ? 'custom-personal' : 'business'), t.cat === 'restaurant' ? 'restaurant' : (t.cat === 'life' ? 'person' : 'company'), t.id);
});

/* ---------- pricing toggle + request shortcuts ---------- */
$('#bill').addEventListener('click', e => { const b = e.target.closest('[data-bill]'); if (!b) return; billing = b.dataset.bill; store.set('bill', billing); renderPricing(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-req]'); if (!b) return;
  requestFor(b.dataset.req, b.dataset.who, '');
});
$('#cusCta').addEventListener('click', () => requestFor('custom-personal', 'person', ''));
function requestFor(type, who, tpl){
  $('#result').hidden = true; $('#reqForm').hidden = false;
  if (type) $('#fType').value = type;
  if (who){ const r = document.getElementById('who-' + who); if (r) r.checked = true; }
  if (tpl !== undefined && tpl !== null) $('#fTpl').value = tpl;
  $('#request').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'start'});
  setTimeout(() => $('#fName').focus({preventScroll:true}), reduced() ? 0 : 600);
}

/* ---------- request form ---------- */
const slipNo = String(Math.floor(1000 + Math.random() * 8999));
let lastReq = null;
function readForm(){
  const F = S[lang].f, who = (document.querySelector('input[name="who"]:checked') || {}).value || '';
  const label = (sel) => { const o = $(sel).selectedOptions[0]; return o ? o.textContent : ''; };
  return {
    who, whoLabel: (F.whoOpts.find(o => o[0] === who) || [,,''])[2],
    type: $('#fType').value, typeLabel: label('#fType'),
    template: $('#fTpl').value, templateLabel: label('#fTpl'),
    name: $('#fName').value.trim(), org: $('#fOrg').value.trim(), contact: $('#fContact').value.trim(),
    date: $('#fDate').value, budget: $('#fBudget').value, budgetLabel: label('#fBudget'), message: $('#fMsg').value.trim(), lang
  };
}
function reqText(r){
  const F = S[lang].f, n = v => v || F.none;
  return [F.subj + ' (' + F.slip + ' ' + slipNo + ')', '',
    F.who + ': ' + n(r.whoLabel), F.type + ': ' + n(r.typeLabel), F.tpl + ': ' + n(r.templateLabel),
    F.name + ': ' + n(r.name), F.org + ': ' + n(r.org), F.contact + ': ' + n(r.contact),
    F.date + ': ' + n(r.date), F.budget + ': ' + n(r.budgetLabel), F.msg + ': ' + n(r.message)].join('\n');
}
function showResult(mode){
  const F = S[lang].f, box = $('#result');
  const head = mode === 'ok' ? F.okH : mode === 'fail' ? F.failH : F.readyH;
  const body = mode === 'ok' ? F.ok : fill(mode === 'fail' ? F.fail : F.ready, {email: CONFIG.email});
  box.innerHTML = '<h3>'+ic(mode === 'ok' ? 'check' : 'mail')+esc(head)+'</h3><p class="muted">'+esc(body)+'</p>'+
    (mode !== 'ok' ? '<pre id="reqText">'+esc(reqText(lastReq))+'</pre>' : '')+
    '<div class="row">'+(mode !== 'ok' ? '<button type="button" class="btn primary small" id="copyReq">'+ic('copy')+'<span>'+esc(F.copy)+'</span></button>' : '')+
    '<button type="button" class="btn ghost small" id="editReq">'+esc(F.edit)+'</button></div>';
  box.hidden = false; $('#reqForm').hidden = true;
  const cp = $('#copyReq');
  if (cp) cp.addEventListener('click', () => {
    const text = reqText(lastReq), done = () => { cp.querySelector('span').textContent = F.copied; };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('#reqText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, sel); else sel();
  });
  $('#editReq').addEventListener('click', () => { box.hidden = true; $('#reqForm').hidden = false; $('#fName').focus(); });
}
function validate(){
  const F = S[lang].f; let ok = true;
  const name = $('#fName').value.trim(), contact = $('#fContact').value.trim();
  $('#fbName').classList.toggle('bad', !name); $('#eName').textContent = name ? '' : F.eName;
  const cOk = /@/.test(contact) || contact.replace(/\D/g, '').length >= 9;
  $('#fbContact').classList.toggle('bad', !cOk); $('#eContact').textContent = cOk ? '' : F.eContact;
  $('#fName').setAttribute('aria-invalid', !name); $('#fContact').setAttribute('aria-invalid', !cOk);
  if (!name){ $('#fName').focus(); ok = false; } else if (!cOk){ $('#fContact').focus(); ok = false; }
  return ok;
}
$('#reqForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!validate()) return;
  lastReq = readForm();
  if (!CONFIG.formEndpoint){ lastReq.mode = 'ready'; showResult('ready'); return; }
  const btn = $('#reqForm [type="submit"]'); btn.disabled = true;
  fetch(CONFIG.formEndpoint, {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(Object.assign({slip: slipNo, summary: reqText(lastReq)}, lastReq))})
    .then(r => { if (!r.ok) throw new Error(r.status); lastReq.mode = 'ok'; showResult('ok'); })
    .catch(() => { lastReq.mode = 'fail'; showResult('fail'); })
    .finally(() => { btn.disabled = false; });
});
['#fName','#fContact'].forEach(id => $(id).addEventListener('input', () => { if ($(id).closest('.field').classList.contains('bad')) validate(); }));

/* ---------- go ---------- */
renderAll();
})();
</script>
</body>
</html>
