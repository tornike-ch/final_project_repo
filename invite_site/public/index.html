<!DOCTYPE html>

<meta name="description" content="ინტერაქტიული სასწავლო თამაშები, ონბორდინგის მარშრუტები, ბრენდის თამაშები და მოსაწვევები, რომლებიც ბმულით იხსნება ნებისმიერ ტელეფონზე. სტუდია თბილისში.">
<link rel="canonical" href="https://gancda.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gancda">
<meta property="og:url" content="https://gancda.com/">

<meta property="og:description" content="სასწავლო თამაშები, ონბორდინგი, ბრენდის თამაშები და მოსაწვევები ბმულით, ნებისმიერ ტელეფონზე. Games that train, onboard and sell.">
<meta property="og:locale" content="ka_GE">
<meta property="og:locale:alternate" content="en_US">

<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235B4BFF'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-size='18' font-weight='800' fill='white' font-family='sans-serif'%3E%E1%83%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..800&family=Noto+Sans+Georgian:wght@400..800&display=swap">
<style>
/* ---------- Gancda: tokens ---------- */
:root{
  --bg:#FAFAF7;--surface:#FFFFFF;--surface2:#F3F2EE;--ink:#0E0E11;--ink2:#3A3A42;--muted:#6E6E78;--line:#E6E4DE;
  --acc:#5B4BFF;--acc-ink:#FFFFFF;--acc-soft:#ECEAFF;--ok:#0E8A57;--ok-soft:#E3F6EC;--bad:#C2333A;--bad-soft:#FDECEC;--warm:#FFB020;
  --shadow:0 1px 2px rgba(14,14,17,.05),0 12px 32px -12px rgba(14,14,17,.18);
  --device:#0E0E11;--r:20px;
  --f-head:"Noto Sans Georgian","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Noto Sans Georgian","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Google Sans","Noto Sans Georgian",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0E;--surface:#141418;--surface2:#1C1C22;--ink:#F3F3F6;--ink2:#C9C9D2;--muted:#9A9AA6;--line:#2A2A32;
    --acc:#8C80FF;--acc-ink:#0B0B0E;--acc-soft:#221F45;--ok:#3DD68C;--ok-soft:#10291D;--bad:#FF6B70;--bad-soft:#33161A;--warm:#FFC24D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);--device:#000;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0B0B0E;--surface:#141418;--surface2:#1C1C22;--ink:#F3F3F6;--ink2:#C9C9D2;--muted:#9A9AA6;--line:#2A2A32;
  --acc:#8C80FF;--acc-ink:#0B0B0E;--acc-soft:#221F45;--ok:#3DD68C;--ok-soft:#10291D;--bad:#FF6B70;--bad-soft:#33161A;--warm:#FFC24D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);--device:#000;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
@media (max-width:520px){.wrap{padding:0 16px}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px/1 var(--f-label);letter-spacing:-.01em}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 17px/1 var(--f-head)}
.nav{display:flex;gap:4px;margin-right:auto}
.nav a{padding:8px 12px;border-radius:10px;text-decoration:none;font:500 14px/1 var(--f-label);color:var(--ink2)}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px}
.seg2{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface2)}
.seg2 button{border:0;background:none;padding:6px 10px;border-radius:8px;font:600 13px/1 var(--f-label);color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ibtn{width:38px;height:38px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--ink2)}
.ibtn:hover{background:var(--surface2)}
.hdr .cta{margin-left:4px}
@media (max-width:900px){.nav{display:none}.hdr .wrap{gap:12px;justify-content:space-between}.hdr .cta{display:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;border:1px solid transparent;background:var(--ink);color:var(--bg);
  font:600 15px/1 var(--f-label);text-decoration:none;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{height:38px;padding:0 14px;border-radius:11px;font-size:14px}

/* ---------- hero ---------- */
.hero{padding:40px 0 64px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font:600 13px/1 var(--f-label)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
h1{margin:0 0 16px;font:800 clamp(32px,3.8vw,50px)/1.1 var(--f-head);letter-spacing:-.025em;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
.lede{margin:0 0 28px;max-width:560px;font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--ink2)}
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 26px}
.pick{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,box-shadow .2s,transform .15s}
.pick:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.pick[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.pick .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--ink)}
.pick[aria-pressed="true"] .ic{background:var(--acc);color:var(--acc-ink)}
.pick b{display:block;font:700 15px/1.3 var(--f-label)}
.pick .pt{display:block;color:var(--ink)}
.pick .pt span{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:3px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin:22px 0 0;padding:0;list-style:none;font:500 13px/1.3 var(--f-label);color:var(--muted)}
.facts li{display:flex;align-items:center;gap:6px}
.facts svg{width:16px;height:16px;color:var(--ok)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage .cap{font:500 13px/1.4 var(--f-label);color:var(--muted);display:flex;align-items:center;gap:8px}
.stage .cap i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr;gap:36px}.hero{padding:32px 0 56px}}


/* ---------- the phone ---------- */
.phone{position:relative;width:340px;max-width:100%;aspect-ratio:340/700;background:var(--device);border-radius:48px;padding:11px;box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent)}
.phone::before{content:"";position:absolute;top:20px;left:50%;width:96px;height:26px;margin-left:-48px;background:var(--device);border-radius:14px;z-index:5}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff;color:#0E0E11}
@media (max-width:400px){.phone{width:300px}}

/* ---------- sections ---------- */
.sec{padding:88px 0;border-top:1px solid var(--line)}
.sec-h{max-width:720px;margin:0 0 40px}
.kick{margin:0 0 10px;font:700 13px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
h2{margin:0 0 14px;font:800 clamp(28px,3.6vw,44px)/1.1 var(--f-head);letter-spacing:-.02em}
.sec-h p{margin:0;font-size:17px;color:var(--ink2)}
@media (max-width:640px){.sec{padding:64px 0}}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{padding:22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.card .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);margin-bottom:16px}
.card h3{margin:0 0 6px;font:700 18px/1.3 var(--f-label)}
.card p{margin:0 0 12px;font-size:15px;color:var(--ink2)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.card li{display:flex;gap:8px}
.card li svg{width:16px;height:16px;margin-top:3px;color:var(--ok)}
.card .play{margin-top:16px}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{position:relative;padding:0 18px 0 0}
.steps li::after{content:"";position:absolute;top:16px;left:44px;right:8px;height:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font:700 14px/1 var(--f-label);margin-bottom:16px}
.steps b{display:block;font:700 17px/1.3 var(--f-label);margin-bottom:6px}
.steps span{display:block;font-size:15px;color:var(--ink2)}
.steps small{display:block;margin-top:10px;font:600 12px/1 var(--f-label);color:var(--muted)}
@media (max-width:1000px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}.steps li:nth-child(2)::after{display:none}}
@media (max-width:560px){.steps{grid-template-columns:1fr}.steps li::after{display:none}}

/* results dashboard */
.dash-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center}
.dash{padding:22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.dash-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.dash-top b{font:700 15px/1.3 var(--f-label)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);font:600 12px/1.2 var(--f-label);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{padding:14px;border-radius:14px;background:var(--surface2)}
.kpi b{display:block;font:800 clamp(18px,2.2vw,26px)/1.1 var(--f-label);letter-spacing:-.02em;white-space:nowrap}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:14px}
.bar .t{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--ink2)}
.bar .tr{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;grid-column:1/-1}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--acc);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.checks{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:var(--ink2)}
.checks li svg{width:22px;height:22px;flex:none;color:var(--acc)}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr}}

/* packages */
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pkg{display:flex;flex-direction:column;padding:26px;border-radius:24px;background:transparent;border:1px solid var(--line)}
.pkg.hl{background:var(--surface);border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent),var(--shadow)}
.pkg .badge{align-self:flex-start;margin-bottom:14px;padding:4px 10px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:700 12px/1.2 var(--f-label)}
.pkg h3{margin:0 0 6px;font:800 22px/1.2 var(--f-label)}
.pkg .for{margin:0 0 16px;color:var(--ink2);font-size:15px}
.pkg .time{font:700 14px/1.2 var(--f-label);color:var(--ink);margin-bottom:16px;display:flex;gap:8px;align-items:center}
.pkg .time svg{width:18px;height:18px;color:var(--acc)}
.pkg ul{margin:0 0 22px;padding:0;list-style:none;display:grid;gap:9px;font-size:15px;color:var(--ink2)}
.pkg li{display:flex;gap:10px}
.pkg li svg{width:18px;height:18px;margin-top:3px;color:var(--ok)}
.pkg .btn{margin-top:auto}
.note{margin:18px 0 0;font-size:14px;color:var(--muted)}
@media (max-width:900px){.pkgs{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:40px;align-items:start}
.form{padding:26px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label,.field legend{font:600 13px/1.2 var(--f-label);color:var(--ink2);padding:0}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;transition:border-color .2s}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.field.bad input{border-color:var(--bad)}
.field .err{min-height:16px;font-size:12px;color:var(--bad)}
fieldset.field{border:0;margin:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.chips span{display:inline-flex;padding:9px 14px;border-radius:99px;border:1px solid var(--line);font:600 14px/1 var(--f-label);color:var(--ink2);transition:all .15s}
.chips input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.form-foot small{color:var(--muted);font-size:13px;max-width:320px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sent{text-align:center;padding:30px 10px}
.sent .ok{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.sent .ok svg{width:32px;height:32px}
.sent h3{margin:0 0 8px;font:800 22px/1.3 var(--f-label)}
.sent p{margin:0 0 16px;color:var(--ink2)}
.sent pre{text-align:left;white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:14px;font-size:13px}
.mail{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font:700 18px/1 var(--f-label);text-decoration:none}
.mail svg{color:var(--acc)}
@media (max-width:900px){.contact{grid-template-columns:1fr}}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}

footer{padding:36px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}

/* ---------- inside the phone: shared app UI ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;font:400 15px/1.45 var(--f-body);color:#111;background:#fff}
.app *{box-sizing:border-box}
.app-top{padding:50px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #EEE}
.app-top .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 15px/1 var(--f-label);flex:none}
.app-top b{display:block;font:700 14px/1.2 var(--f-label)}
.app-top small{display:block;font-size:12px;color:#5E5E68}
.app-top .xp{white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:99px;background:#FFF4D6;color:#8A5A00;font:700 12px/1 var(--f-label)}
.app-top .xp svg{width:14px;height:14px}
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 20px;scrollbar-width:none}
.app-body::-webkit-scrollbar{display:none}
.app .pbar{height:6px;border-radius:99px;background:#EEE;overflow:hidden;margin:0 18px 0;flex:none}
.app .pbar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.abtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;font:700 15px/1 var(--f-label);color:#fff;
  transition:transform .12s,filter .2s;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.abtn.light{background:#F2F2F4;color:#111;box-shadow:0 3px 0 #DADADF}
.abtn svg{width:18px;height:18px}
.a-h{margin:4px 0 6px;font:800 22px/1.2 var(--f-head);letter-spacing:-.01em}
.a-p{margin:0 0 16px;color:#555;font-size:14px}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),720px) rotate(var(--r));opacity:.9}}

/* learning: the service simulator */
.l-mood{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#F6F6F8;margin-bottom:14px}
.l-mood svg{width:34px;height:34px;flex:none}
.l-mood .m{flex:1}
.l-mood small{display:block;font:600 11px/1.2 var(--f-label);color:#777;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.l-mood .tr{height:8px;border-radius:99px;background:#E6E6EA;overflow:hidden}
.l-mood .tr i{display:block;height:100%;border-radius:99px;transition:width .6s,background .6s}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45}
.msg.them{align-self:flex-start;background:#F1F1F4;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;color:#fff;border-bottom-right-radius:6px}
.msg .who{display:block;font:700 12px/1.2 var(--f-label);opacity:.85;margin-bottom:3px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;border:2px solid #E8E8EC;background:#fff;font-size:14px;line-height:1.4;transition:border-color .15s,transform .1s}
.opt:hover{border-color:#C9C9D2}
.opt:active{transform:scale(.99)}
.fb{padding:12px 14px;border-radius:14px;margin:4px 0 14px;font-size:13.5px;line-height:1.5}
.fb b{display:flex;align-items:center;gap:6px;font:800 14px/1.2 var(--f-label);margin-bottom:4px}
.fb b svg{width:18px;height:18px}
.fb.good{background:#E3F6EC;color:#0C5C3A}
.fb.mid{background:#FFF4D6;color:#6B4600}
.fb.bad{background:#FDECEC;color:#8A1F23}
.end{text-align:center;padding-top:6px}
.medal{width:96px;height:96px;margin:8px auto 12px}
.stars{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.stars svg{width:30px;height:30px}
.skills{display:grid;gap:10px;margin:16px 0 18px;text-align:left}
.skill .t{display:flex;justify-content:space-between;font:600 13px/1.2 var(--f-label);margin-bottom:5px}
.skill .tr{height:8px;border-radius:99px;background:#EEE;overflow:hidden}
.skill .tr i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s .2s cubic-bezier(.2,.8,.2,1)}

/* onboarding: the journey */
.map{position:relative;display:grid;gap:12px;padding-left:4px}
.map::before{content:"";position:absolute;left:25px;top:24px;bottom:24px;width:3px;border-radius:3px;background:#ECECF1}
.stop{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px 10px 4px;border:0;background:none;text-align:left;border-radius:16px}
.stop .dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:#ECECF1;color:#999;border:3px solid #fff;transition:all .3s}
.stop .dot svg{width:20px;height:20px}
.stop b{display:block;font:700 15px/1.25 var(--f-label)}
.stop small{display:block;font-size:12px;color:#5E5E68}
.stop.now{background:#F5F4FF}
.stop.now .dot{color:#fff;box-shadow:0 0 0 6px rgba(91,75,255,.15);animation:bob 1.6s ease-in-out infinite}
.stop.done .dot{color:#fff}
.stop[disabled]{cursor:default}
@keyframes bob{50%{transform:translateY(-3px)}}
.team{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mate{position:relative;height:150px;border:0;padding:0;background:none;perspective:600px}
.mate .in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mate.flip .in{transform:rotateY(180deg)}
.mate .f,.mate .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.mate .f{background:#F4F4F7}
.mate .b{color:#fff;transform:rotateY(180deg);font-size:12.5px;line-height:1.4}
.mate .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 20px/1 var(--f-label)}
.mate b{font:700 14px/1.2 var(--f-label)}
.mate small{font-size:12px;color:#5E5E68}
.mate .b b{font-size:13px}
.mate .tap{font:600 12px/1 var(--f-label);color:#5E5E68}
.q{padding:14px;border-radius:16px;background:#F6F6F8;margin-bottom:12px}
.q p{margin:0 0 10px;font:700 15px/1.35 var(--f-label)}
.who-row{display:flex;gap:8px;justify-content:space-between}
.who-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border:2px solid transparent;border-radius:14px;background:#fff;font:600 12px/1.2 var(--f-label);overflow-wrap:anywhere}
.who-btn .av{width:40px;height:40px;font-size:15px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.who-btn.right{border-color:#14A86B;background:#E3F6EC}
.who-btn.wrong{border-color:#E5484D;background:#FDECEC}
.task{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;border:2px solid #EEE;border-radius:14px;background:#fff;text-align:left;font-size:14px;transition:all .2s}
.task .bx{width:26px;height:26px;border-radius:8px;border:2px solid #CCC;display:grid;place-items:center;flex:none;transition:all .25s}
.task .bx svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1);color:#fff}
.task.on{border-color:#C9F0DA;background:#F2FBF6}
.task.on .bx{background:#14A86B;border-color:#14A86B}
.task.on .bx svg{opacity:1;transform:none}
.task.on span{text-decoration:line-through;color:#5E5E68}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.vote button{height:44px;border-radius:12px;border:2px solid #E6E6EA;background:#fff;font:700 13px/1 var(--f-label)}
.vote button.right{border-color:#14A86B;background:#E3F6EC;color:#0C5C3A}
.vote button.wrong{border-color:#E5484D;background:#FDECEC;color:#8A1F23}
.why{font-size:12.5px;color:#555;margin:8px 0 0}
.badge-big{width:120px;height:120px;margin:6px auto 12px;border-radius:32px;display:grid;place-items:center;color:#fff;transform:rotate(-6deg)}
.badge-big svg{width:60px;height:60px}
.buddy{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#F6F6F8;text-align:left;margin:14px 0}
.buddy .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 16px/1 var(--f-label);flex:none}
.buddy b{display:block;font:700 14px/1.2 var(--f-label)}
.buddy small{font-size:12.5px;color:#666}

/* brand game: catch the beans */
.game{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.game .hud{position:absolute;top:50px;left:14px;right:14px;z-index:3;display:flex;justify-content:space-between;align-items:center;color:#fff;font:800 15px/1 var(--f-label)}
.game .hud span{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:rgba(0,0,0,.25)}
.game .hud svg{width:16px;height:16px}
.game .drop{position:absolute;top:0;left:0;width:34px;height:34px;will-change:transform}
.game .cup{position:absolute;bottom:26px;left:0;width:78px;height:64px;will-change:transform}
.game .float{position:absolute;z-index:4;font:800 18px/1 var(--f-label);color:#fff;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.g-over{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:60px 22px 26px;color:#fff;text-align:center}
.g-over .a-h{color:#fff;font-size:26px}
.g-over .a-p{color:rgba(255,255,255,.85)}
.how3{display:grid;gap:8px;margin:0 0 20px;text-align:left}
.how3 div{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.12);font-size:13.5px}
.how3 svg{width:30px;height:30px;flex:none}
.scratch{position:relative;height:120px;border-radius:18px;overflow:hidden;margin:6px 0 14px;background:#fff;color:#0E3B2C;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scratch b{font:800 26px/1.1 var(--f-label)}
.scratch code{font:700 15px/1 ui-monospace,monospace;letter-spacing:.1em;margin-top:8px;padding:5px 10px;border-radius:8px;background:#EEF7E2}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.lb{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:4px;text-align:left}
.lb li{display:flex;justify-content:space-between;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.1);font:600 13px/1.2 var(--f-label)}
.lb li.me{background:#C8F04A;color:#0E3B2C}

/* invitation */
.inv{position:absolute;inset:0;display:flex;flex-direction:column;background:#111018;color:#fff;overflow:hidden}
.inv-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:58px 20px 22px;scrollbar-width:none}
.inv-body::-webkit-scrollbar{display:none}
.env{position:relative;display:block;width:min(240px,100%);height:170px;margin:40px auto 24px;padding:0;border:0;background:none;cursor:pointer;perspective:800px}
.env .back{position:absolute;inset:0;border-radius:12px;background:#2B2840}
.env .card{position:absolute;left:14px;right:14px;top:14px;bottom:14px;border-radius:10px;background:#fff;color:#111;display:grid;place-items:start center;padding-top:14px;font:800 18px/1.2 var(--f-label);opacity:0;transition:transform .7s .25s cubic-bezier(.3,1.3,.5,1),opacity .2s .2s}
.env .front{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,#3A3560,#24213A);clip-path:polygon(0 40%,50% 72%,100% 40%,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#4A4478;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;border-radius:12px 12px 0 0}
.env .seal{position:absolute;left:50%;top:52%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#C8333A;color:#fff;display:grid;place-items:center;font:800 16px/1 var(--f-label);z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0}
.env.open .card{transform:translateY(-70px);opacity:1}
.inv-kick{font:700 12px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:#C8B8FF;margin:0 0 10px}
.inv-h{margin:0 0 8px;font:800 28px/1.1 var(--f-head);letter-spacing:-.01em}
.inv-p{margin:0 0 18px;color:#C9C6D8;font-size:14px}
.inv-meta{display:grid;gap:8px;margin-bottom:18px}
.inv-meta div{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:14px;background:#1D1B2B}
.inv-meta svg{width:20px;height:20px;color:#C8B8FF;flex:none}
.inv-meta b{display:block;font:700 14px/1.2 var(--f-label)}
.inv-meta small{display:block;font-size:12px;color:#9C98B3}
.prog{margin:0 0 18px;padding:0;list-style:none;border-left:2px solid #2F2C45;display:grid;gap:10px}
.prog li{position:relative;padding-left:16px;font-size:13.5px;color:#D9D6E8}
.prog li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:#C8B8FF}
.prog b{color:#fff;font-family:var(--f-label);margin-right:6px}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rsvp button{height:50px;border-radius:14px;border:0;font:700 14px/1 var(--f-label)}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:#1D1B2B;margin:12px 0}
.stepper div{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:#2F2C45;color:#fff;font:700 18px/1 var(--f-label)}
.stepper b{min-width:16px;text-align:center;font:800 17px/1 var(--f-label)}
.ticket{position:relative;border-radius:18px;background:#fff;color:#111;padding:18px;margin:6px 0 14px}
.ticket::before,.ticket::after{content:"";position:absolute;top:62%;width:22px;height:22px;border-radius:50%;background:#111018}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket .tk-h{font:800 18px/1.2 var(--f-label)}
.ticket .tk-s{font-size:12.5px;color:#666;margin-bottom:12px}
.ticket .tk-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;border-top:2px dashed #E5E5EA;padding-top:12px}
.ticket .tk-g b{display:block;font:700 13px/1.2 var(--f-label)}
.ticket .qr{position:absolute;right:16px;top:16px;width:58px;height:58px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.cd div{padding:10px 0;border-radius:12px;background:#1D1B2B;text-align:center}
.cd b{display:block;font:800 20px/1 var(--f-label)}
.cd small{font-size:12px;color:#B9B5CF}
.inv .abtn.light{background:#26233A;color:#fff;box-shadow:0 3px 0 #15131F}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  *,*::before,*::after{animation-delay:0s!important}
  .confetti{display:none}
}

/* ---------- review fixes ---------- */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font:600 14px/1 var(--f-label);text-decoration:none}
.skip:focus{top:12px}
.game:focus-visible,.inv :focus-visible,.gm :focus-visible{outline:3px solid #fff;outline-offset:2px}
.band{background:var(--surface2)}
.band .dash{background:var(--surface)}
.mini{font:700 12px/1.3 var(--f-label);color:#5E5E68;text-transform:uppercase;letter-spacing:.04em}
.mini2{margin:0 0 10px;font:600 13px/1.3 var(--f-label);color:var(--muted)}
.hard{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font:600 13px/1.4 var(--f-label)}

/* who it is for */
.personas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.persona{display:flex;flex-direction:column;padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.persona .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);margin-bottom:16px}
.persona h3{margin:0 0 6px;font:800 20px/1.25 var(--f-label)}
.persona>p{margin:0 0 16px;font-size:15.5px;color:var(--ink2)}
.persona ul{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:7px;font-size:14px;color:var(--ink2)}
.persona li{display:flex;gap:8px}
.persona li svg{width:16px;height:16px;margin-top:3px;color:var(--ok)}
.persona .row{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.persona .btn svg{width:16px;height:16px}
@media (max-width:900px){.personas{grid-template-columns:1fr}}

/* faq */
.faq-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}
.faq{display:grid;gap:10px}
.faq details{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 18px}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font:700 16px/1.35 var(--f-label);cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{transition:transform .2s;color:var(--acc)}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{margin:0 0 16px;color:var(--ink2)}
@media (max-width:900px){.faq-grid{grid-template-columns:1fr;gap:8px}}
.unsure{display:flex;align-items:center;gap:8px;margin:20px 0 0;font:600 15px/1.4 var(--f-label)}
.unsure svg{color:var(--acc)}
.unsure a{color:var(--ink);text-underline-offset:3px}
.sent .ok.warn{background:var(--surface2);color:var(--ink)}
.err-s{font:600 13px/1.4 var(--f-label);color:var(--bad)}

/* mobile hero: headline, then the phone right after the demo picker */
@media (max-width:980px){
  .hero-grid{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .hero-text{display:contents}
  .hero .eyebrow{order:1;align-self:flex-start}
  .hero h1{order:2}
  .hero .lede{order:3;margin-bottom:18px}
  .picker{order:4;display:flex;overflow-x:auto;gap:8px;margin:0 -24px 18px;padding:2px 24px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
  .picker::-webkit-scrollbar{display:none}
  .pick{flex:none;scroll-snap-align:start;padding:9px 14px 9px 9px;align-items:center;border-radius:99px}
  .pick .ic{width:30px;height:30px;border-radius:50%}
  .pick .ic svg{width:17px;height:17px}
  .pick .pt span{display:none}
  .pick b{font-size:14px;white-space:nowrap}
  .stage{order:5;margin-bottom:28px}
  .hero .row{order:6}
  .facts{order:7}
  .phone{width:300px}
}
@media (max-width:520px){.picker{margin:0 -16px 16px;padding:2px 16px 4px}}

/* inside the phone */
.app-top .tt{min-width:0}
.app-top .tt b,.app-top .tt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .pbar{margin-top:10px}
.hero-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:6px 0 14px}
.hero-ic svg{width:28px;height:28px}
.who-list{margin:0 0 18px;padding:0;list-style:none;counter-reset:w;display:grid;gap:8px}
.who-list li{display:flex;gap:10px;align-items:center;font-size:14px;color:#3A3A42}
.who-list li::before{counter-increment:w;content:counter(w);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#F1F1F4;font:700 12px var(--f-label)}
.linkbtn,.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font:700 13px/1.2 var(--f-label);color:#4A3AD8}
.linkbtn{margin:-6px 0 12px}
.backbtn{margin:8px 16px 0;align-self:flex-start;color:#5E5E68}
.linkbtn svg,.backbtn svg{width:16px;height:16px}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;font:700 13px/1 var(--f-label)}
.pill svg{width:14px;height:14px}
.pill.gold{background:#FFF4D6;color:#7A4F00}.pill.green{background:#E3F6EC;color:#0B6B47}
.seg3{display:flex;gap:6px;flex-wrap:wrap}
.seg3 button{flex:1;min-width:52px;height:40px;border-radius:11px;border:2px solid #E6E6EA;background:#fff;font:700 13px/1 var(--f-label)}
.seg3 button[aria-pressed="true"]{border-color:#0B7F63;background:#E3F6EC;color:#0B5A46}
.vote button{display:flex;align-items:center;justify-content:center;gap:6px}
.vote button svg,.who-btn svg{width:16px;height:16px}
.who-row{gap:6px}
.see{margin:14px 0;padding:12px 14px;border-radius:16px;background:#F4F3FF;border:1px dashed #B9B0FF;text-align:left}
.see-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.see-h svg{width:18px;height:18px;color:#4A3AD8}
.see-h b{font:800 13px/1.2 var(--f-label);color:#2A2270}
.see-h span{margin-left:auto;font:600 11.5px/1 var(--f-label);color:#5E5E68}
.see-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.see-g div{padding:8px;border-radius:10px;background:#fff}
.see-g b{display:block;font:800 16px/1.1 var(--f-label);color:#111}
.see-g span{display:block;margin-top:3px;font-size:11.5px;line-height:1.3;color:#5E5E68}
.see-l{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px}
.see-l li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;background:#fff}
.see.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}

class Game extends Demo {
  constructor(el){ super(el); this.phase = 'intro'; this.render(); }
  shell(inner, play){ return '<div class="app gm"><div class="game"' + (play ? ' tabindex="0" role="application" aria-label="' + esc(tx(GAME.h) + '. ' + tx(GAME.hint)) + '"' : '') + '>' + inner + '</div></div>'; }
  render(){ if (this.phase === 'intro') this.intro(); else if (this.phase === 'over') this.over(true); }
  intro(){
    this.stop(); this.phase = 'intro'; const D = GAME;
    this.el.innerHTML = this.shell('<div class="g-over pop"><div class="g-logo">ც</div>' +
      '<p class="g-kick">' + esc(tx(D.brand)) + '</p><h3 class="a-h">' + esc(tx(D.h)) + '</h3><p class="a-p">' + esc(tx(D.p)) + '</p>' +
      '<div class="how3"><div>' + BEAN(false) + esc(tx(D.how[0])) + '</div><div>' + BEAN(true) + esc(tx(D.how[1])) + '</div><div>' + ICE + esc(tx(D.how[2])) + '</div></div>' +
      '<button type="button" class="abtn lime" data-a="go">' + esc(tx(D.start)) + ic('arrow') + '</button>' +
      '<p class="g-hint">' + esc(tx(D.hint)) + '</p></div>');
  }
  play(){
    this.stop(); this.phase = 'play';
    this.el.innerHTML = this.shell('<div class="hud"><span>' + ic('star') + '<b id="gScore">0</b></span><span class="combo" id="gCombo" hidden>×2</span><span>' + ic('clock') + '<b id="gTime">15</b></span></div><div class="cup" id="gCup">' + CUP + '</div><div class="chill" id="gChill"></div>', true);
    const g = $('.game', this.el), cup = $('#gCup', this.el);
    g.focus({preventScroll:true});
    const W = g.clientWidth, H = g.clientHeight;
    const st = this.g = {g, cup, W, H, x:W / 2 - 39, tx:W / 2 - 39, score:0, streak:0, t0:performance.now(), last:performance.now(), spawn:0, drops:[], on:true, keys:{}};
    const move = e => { const r = g.getBoundingClientRect(); st.tx = Math.max(0, Math.min(W - 78, (e.clientX - r.left) - 39)); };
    g.addEventListener('pointerdown', e => { move(e); if (g.setPointerCapture) g.setPointerCapture(e.pointerId); });
    g.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) move(e); });
    g.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ st.keys[e.key] = true; e.preventDefault(); } });
    g.addEventListener('keyup', e => { st.keys[e.key] = false; });
    const loop = now => {
      if (!st.on) return;
      const dt = Math.min(.05, (now - st.last) / 1000); st.last = now;
      const el = (now - st.t0) / 1000, left = Math.max(0, 15 - el), late = el > 7;
      $('#gTime', this.el).textContent = Math.ceil(left);
      if (st.keys.ArrowLeft) st.tx = Math.max(0, st.tx - 420 * dt);
      if (st.keys.ArrowRight) st.tx = Math.min(W - 78, st.tx + 420 * dt);
      st.spawn -= dt;
      if (st.spawn <= 0 && left > .5){
        st.spawn = Math.max(.3, .6 - el * .018);
        const r = Math.random(), type = r < .1 ? 'gold' : r < (late ? .42 : .3) ? 'ice' : 'bean';
        const d = document.createElement('div'); d.className = 'drop'; d.innerHTML = type === 'ice' ? ICE : BEAN(type === 'gold'); g.appendChild(d);
        st.drops.push({d, type, x:8 + Math.random() * (W - 50), y:-40, v:(170 + Math.random() * 90 + el * 14) * (type === 'gold' ? 1.3 : 1), rot:Math.random() * 360, vr:Math.random() * 200 - 100});
      }
      st.x += (st.tx - st.x) * Math.min(1, dt * 14);
      cup.style.transform = 'translateX(' + st.x + 'px)';
      const rim = H - 26 - 64;
      st.drops = st.drops.filter(o => {
        const prev = o.y; o.y += o.v * dt; o.rot += o.vr * dt;
        o.d.style.transform = 'translate(' + o.x + 'px,' + o.y + 'px) rotate(' + o.rot + 'deg)';
        // only a drop that crosses the rim inside the cup's mouth counts
        const bottom = o.y + 28, prevBottom = prev + 28, cx = o.x + 17;
        if (prevBottom <= rim + 4 && bottom >= rim && cx > st.x + 12 && cx < st.x + 62){
          let pts = o.type === 'gold' ? 3 : o.type === 'ice' ? -2 : 1;
          if (o.type === 'bean'){ st.streak++; if (st.streak >= 3) pts = 2; } else if (o.type === 'ice') st.streak = 0;
          $('#gCombo', this.el).hidden = st.streak < 3;
          st.score = Math.max(0, st.score + pts); $('#gScore', this.el).textContent = st.score;
          const f = document.createElement('div'); f.className = 'float'; f.textContent = (pts > 0 ? '+' : '') + pts; f.style.left = (st.x + 30) + 'px'; f.style.top = (rim - 10) + 'px';
          if (pts < 0) f.style.color = '#BDEBFF'; g.appendChild(f); setTimeout(() => f.remove(), 800);
          if (pts < 0){ cup.classList.remove('shake'); void cup.offsetWidth; cup.classList.add('shake'); const c = $('#gChill', this.el); c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); }
          o.d.remove(); return false;
        }
        if (o.y > H){ if (o.type === 'bean') st.streak = 0; $('#gCombo', this.el).hidden = st.streak < 3; o.d.remove(); return false; }
        return true;
      });
      if (left <= 0 && !st.drops.length){ this.result = {score:st.score}; return this.over(); }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  over(again){
    this.stop(); this.phase = 'over'; const D = GAME, sc = this.result.score;
    // one prize per phone per day; replays only count for the leaderboard
    let saved = null; try { saved = JSON.parse(store.get('prize') || 'null'); } catch (e) {}
    if (!again){
      if (saved && saved.day === today()) this.result.keep = saved;
      else { const tier = D.prizes.findIndex(p => sc >= p[0]); saved = {day:today(), tier, code:'TSK-' + Math.random().toString(36).slice(2, 6).toUpperCase(), score:sc}; store.set('prize', JSON.stringify(saved)); this.result.prize = saved; }
    }
    const pz = this.result.prize || this.result.keep, prize = D.prizes[pz.tier][1];
    const board = [['ნინო', 'Nino', 34], ['გიორგი', 'Giorgi', 27], ['მაკა', 'Maka', 21], ['ლუკა', 'Luka', 15]].map(r => [lang === 'ka' ? r[0] : r[1], r[2], false]);
    board.push([tx(D.you), sc, true]); board.sort((a, b) => b[1] - a[1]);
    this.el.innerHTML = this.shell('<div class="g-over pop" style="justify-content:flex-start;overflow-y:auto"><p class="g-kick">' + esc(tx(D.over)) + '</p>' +
      '<h3 class="a-h" style="font-size:44px;margin:0">' + sc + '</h3><p class="a-p" style="margin-bottom:12px">' + esc(tx(D.pts)) + '</p>' +
      (this.result.keep ? '<p class="g-note">' + esc(tx(D.saved)) + '</p>' : '') +
      '<div class="scratch"><b>' + esc(tx(prize)) + '</b><code>' + pz.code + '</code><small>' + esc(tx(D.code)) + '</small>' + (this.result.keep || again ? '' : '<canvas id="gScr" role="button" tabindex="0" aria-label="' + esc(tx(D.reveal)) + '"></canvas>') + '</div>' +
      '<p class="g-kick" style="text-align:left;color:rgba(255,255,255,.8)">' + esc(tx(D.board)) + '</p><ol class="lb">' + board.slice(0, 5).map((r, k) => '<li class="' + (r[2] ? 'me' : '') + '"><span>' + (k + 1) + '. ' + esc(r[0]) + '</span><span>' + r[1] + '</span></li>').join('') + '</ol>' +
      seeCard(D.brandT, D.brandSee, true) +
      '<button type="button" class="abtn lime" data-a="go">' + ic('refresh') + esc(tx(D.again)) + '</button></div>');
    const cv = $('#gScr', this.el); if (cv) this.scratch(cv, tx(D.scratch));
    if (!again){ const h = $('.a-h', this.el); h.setAttribute('tabindex', '-1'); h.focus({preventScroll:true}); say(tx(D.over) + ' ' + sc + ' ' + tx(D.pts) + '. ' + tx(prize)); if (sc >= 18) confetti(this.el, 60); }
  }
  scratch(cv, label){
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const gr = c.createLinearGradient(0, 0, r.width, r.height); gr.addColorStop(0, '#C8F04A'); gr.addColorStop(1, '#9FD12E');
    c.fillStyle = gr; c.fillRect(0, 0, r.width, r.height);
    c.fillStyle = '#0E3B2C'; c.font = '700 14px "Google Sans","Noto Sans Georgian",sans-serif'; c.textAlign = 'center'; c.fillText(label, r.width / 2, r.height / 2 + 5);
    c.globalCompositeOperation = 'destination-out';
    let down = false, n = 0;
    const done = () => { cv.style.transition = 'opacity .3s'; cv.style.opacity = 0; setTimeout(() => cv.remove(), 300); };
    const at = e => { const b = cv.getBoundingClientRect(); c.beginPath(); c.arc(e.clientX - b.left, e.clientY - b.top, 20, 0, Math.PI * 2); c.fill(); if (++n > 28) done(); };
    cv.addEventListener('pointerdown', e => { down = true; if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); at(e); });
    cv.addEventListener('pointermove', e => { if (down) at(e); });
    cv.addEventListener('pointerup', () => { down = false; });
    cv.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); done(); } });
  }
  click(e){ const b = e.target.closest('[data-a]'); if (b && b.dataset.a === 'go') this.play(); }
  stop(){ if (this.g) this.g.on = false; cancelAnimationFrame(this.raf); }
  destroy(){ this.stop(); }
}

/* ========== demo 4: the event invitation ========== */
// the party is at 19:00 Tbilisi time (UTC+4), 12 days from today
function partyDate(){ const t = new Date(Date.now() + 4 * 3600e3); return {y:t.getUTCFullYear(), m:t.getUTCMonth(), d:t.getUTCDate() + 12}; }
class Invite extends Demo {
  constructor(el){ super(el); const p = partyDate(), u = new Date(Date.UTC(p.y, p.m, p.d, 15, 0)); this.when = u; this.wd = new Date(Date.UTC(p.y, p.m, p.d, 12)); this.reset(true); }
  reset(silent){ this.s = {view:'env', guests:0, food:0, ans:null, code:'NV-' + Math.floor(1000 + Math.random() * 9000)}; silent ? this.render() : this.go(); }
  date(short){ const d = this.wd, D = S[lang]; return short ? D.dy[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + D.mon[d.getUTCMonth()] : D.days[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + D.months[d.getUTCMonth()]; }
  render(){
    clearInterval(this.t);
    const s = this.s, D = INV;
    let body = '';
    if (s.view === 'env'){
      body = '<div class="env-wrap"><p class="inv-kick">' + esc(tx(D.kick)) + '</p><button type="button" class="env" data-a="open" aria-label="' + esc(tx(D.tap)) + '">' +
        '<span class="back"></span><span class="card">Nova · 5</span><span class="front"></span><span class="flap"></span><span class="seal">N</span></button>' +
        '<p class="tap-hint"><span></span>' + esc(tx(D.tap)) + '</p></div>';
    } else if (s.view === 'card'){
      body = '<div class="pop"><p class="inv-kick">' + esc(tx(D.kick)) + '</p><h3 class="inv-h">' + esc(tx(D.h)) + '</h3><p class="inv-p">' + esc(tx(D.p)) + '</p>' +
        '<div class="inv-meta"><div>' + ic('cal') + '<span><b>' + esc(this.date()) + '</b><small>19:00</small></span></div><div>' + ic('pin') + '<span><b>' + esc(tx(D.venue)) + '</b><small>' + esc(tx(D.venueS)) + '</small></span></div>' +
        '<div>' + ic('shirt') + '<span><b>' + esc(tx(D.dress)) + '</b><small>' + esc(tx(D.dressS)) + '</small></span></div></div>' +
        '<ul class="prog">' + D.prog.map(p => '<li><b>' + p[0] + '</b>' + esc(tx(p[1])) + '</li>').join('') + '</ul>' +
        '<p class="inv-q">' + esc(tx(D.q)) + '</p>' +
        (s.ans === true ? '<div class="stepper"><span id="plusL">' + esc(tx(D.plus)) + '</span><div role="group" aria-labelledby="plusL"><button type="button" data-a="minus" aria-label="−1"' + (s.guests ? '' : ' disabled') + '>' + ic('minus') + '</button><b aria-live="polite">' + s.guests + '</b><button type="button" data-a="plus" aria-label="+1"' + (s.guests >= 1 ? ' disabled' : '') + '>' + ic('plus') + '</button></div></div>' +
          '<p class="inv-sub" id="foodL">' + esc(tx(D.food)) + '</p><div class="foods" role="group" aria-labelledby="foodL">' + D.foods.map((f, k) => '<button type="button" data-a="food" data-k="' + k + '" aria-pressed="' + (s.food === k) + '">' + esc(tx(f)) + '</button>').join('') + '</div>' +
          '<button type="button" class="abtn lav nextb" data-a="confirm">' + ic('check') + esc(tx(D.confirm)) + '</button>'
          : '<div class="rsvp"><button type="button" class="yes" data-a="yes">' + esc(tx(D.yes)) + '</button><button type="button" class="no" data-a="no">' + esc(tx(D.no)) + '</button></div>') + '</div>';
    } else if (s.view === 'ticket'){
      let h = 0; for (const ch of s.code) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      let qr = '';
      for (let i = 0; i < 21 * 21; i++){ const x = i % 21, y = Math.floor(i / 21); if ((x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13)) continue; h = (h * 1103515245 + 12345) >>> 0; if (h & 0x100) qr += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>'; }
      const fnd = (x, y) => '<rect x="' + (x + .5) + '" y="' + (y + .5) + '" width="6" height="6" fill="none" stroke="#111"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>';
      body = '<div class="pop"><p class="inv-kick">' + esc(tx(D.kick)) + '</p><h3 class="inv-h" style="font-size:24px">' + esc(tx(D.tkH)) + '</h3>' +
        '<div class="cd" id="cd" role="timer">' + D.cd.map(x => '<div><b>0</b><small>' + esc(tx(x)) + '</small></div>').join('') + '</div>' +
        '<div class="ticket"><svg class="qr" viewBox="0 0 21 21" fill="#111" aria-hidden="true">' + qr + fnd(0, 0) + fnd(14, 0) + fnd(0, 14) + '</svg>' +
        '<div class="tk-h">Nova · 5</div><div class="tk-s">' + esc(lang === 'ka' ? 'ანა' : 'Ana') + (s.guests ? ' + 1' : '') + ' · ' + esc(tx(D.foods[s.food])) + '</div><div class="tk-g">' +
        '<span>' + esc(tx(D.when)) + '<b>' + esc(this.date(true)) + ' · 19:00</b></span><span>' + esc(tx(D.where)) + '<b>' + esc(tx(D.venue)) + '</b></span>' +
        '<span>' + esc(tx(D.guests)) + '<b>' + (1 + s.guests) + '</b></span><span>' + esc(tx(D.code)) + '<b>' + s.code + '</b></span></div></div>' +
        '<button type="button" class="abtn lav" style="margin-bottom:8px" data-a="ics">' + ic('cal') + esc(tx(D.cal)) + '</button>' +
        seeCard(D.orgT, D.org, true) +
        '<button type="button" class="abtn light" data-a="change">' + esc(tx(D.change)) + '</button></div>';
    } else {
      body = '<div class="pop" style="text-align:center;padding-top:40px"><div class="no-ic">' + ic('heart') + '</div>' +
        '<h3 class="inv-h" style="font-size:24px">' + esc(tx(D.noH)) + '</h3><p class="inv-p">' + esc(tx(D.noP)) + '</p><button type="button" class="abtn light" data-a="change">' + esc(tx(D.change)) + '</button></div>';
    }
    this.el.innerHTML = '<div class="inv"><div class="inv-body">' + body + '</div></div>';
    if (s.view === 'ticket'){ this.tick(); this.t = setInterval(() => this.tick(), 1000); }
  }
  tick(){ const el = $('#cd', this.el); if (!el){ clearInterval(this.t); return; }
    const sec = Math.max(0, Math.floor((this.when - Date.now()) / 1000)), v = [Math.floor(sec / 86400), Math.floor(sec % 86400 / 3600), Math.floor(sec % 3600 / 60), sec % 60];
    $$('b', el).forEach((b, i) => { b.textContent = v[i]; }); }
  ics(){
    const d = this.when, e = new Date(d.getTime() + 4 * 3600e3), f = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const q = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gancda//Demo//EN', 'BEGIN:VEVENT', 'UID:' + this.s.code + '@gancda.com', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(d), 'DTEND:' + f(e),
      'SUMMARY:' + q(tx(INV.h)), 'LOCATION:' + q(tx(INV.venue) + ', Tbilisi'), 'DESCRIPTION:' + q('Gancda demo invitation'), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/calendar'})); a.download = 'nova-5.ics'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  click(e){
    const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    const s = this.s, a = b.dataset.a;
    if (a === 'open'){ b.classList.add('open'); setTimeout(() => { s.view = 'card'; this.go(); }, reduced() ? 0 : 1000); }
    else if (a === 'yes'){ s.ans = true; this.go('[data-a="plus"]'); }
    else if (a === 'no'){ s.ans = false; s.view = 'no'; this.go(); }
    else if (a === 'plus'){ s.guests = 1; this.go('[data-a="minus"]'); }
    else if (a === 'minus'){ s.guests = 0; this.go('[data-a="plus"]'); }
    else if (a === 'food'){ s.food = +b.dataset.k; this.go('[data-a="food"][data-k="' + s.food + '"]'); }
    else if (a === 'confirm'){ s.view = 'ticket'; this.go(); confetti(this.el, 36); say(tx(INV.tkH)); }
    else if (a === 'ics') this.ics();
    else if (a === 'change'){ s.view = 'card'; s.ans = null; this.go(); }
  }
  destroy(){ clearInterval(this.t); }
}

    '<a class="btn ' + (i === 0 ? 'acc' : 'ghost') + '" href="#contact" data-want="' + (i === 0 ? 'pilot' : '') + '">' + esc(p.c) + '</a></article>').join('');
  $('#faqList').innerHTML = D.faq.list.map(q => '<details><summary>' + esc(q[0]) + ic('plus') + '</summary><p>' + esc(q[1]) + '</p></details>').join('');
  const picked = ($('input[name="what"]:checked') || {}).value;
  $('#whatChips').innerHTML = FMT.concat('unsure').map(k => '<label><input type="radio" name="what" value="' + k + '"' + (k === picked ? ' checked' : '') + '><span>' + esc(k === 'unsure' ? D.f.unsure : D.fmt[k].n) + '</span></label>').join('');
  $('#year').textContent = new Date().getFullYear();
  themeIcon();
  if (!$('#sent').hidden && lastReq) showSent(lastReq.mode, lastReq.err, true);
}
let dashSeen = false;
if ('IntersectionObserver' in window) new IntersectionObserver((es, ob) => { if (es[0].isIntersecting){ dashSeen = true; $$('#dash .tr i').forEach(i => { i.style.width = i.dataset.w + '%'; }); ob.disconnect(); } }, {threshold:.3}).observe($('#dash'));
else dashSeen = true;

document.addEventListener('click', e => {
  const p = e.target.closest('#picker .pick'); if (p){ mountDemo(p.dataset.k); if (innerWidth < 980) $('.stage').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'center'}); return; }
  const c = e.target.closest('[data-play]');
  if (c){ mountDemo(c.dataset.play); $('.stage').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'center'}); setTimeout(() => { const f = $('#phone button'); f && f.focus({preventScroll:true}); }, reduced() ? 0 : 500); return; }
  const w = e.target.closest('[data-want]'); if (w && w.dataset.want === 'pilot'){ const m = $('#fMsg'); if (m && !m.value) m.value = lang === 'ka' ? 'გვაინტერესებს პილოტი.' : 'We are interested in a pilot.'; }
});
$$('[data-lang]').forEach(b => b.addEventListener('click', () => { if (lang === b.dataset.lang) return; lang = b.dataset.lang; store.set('lang', lang); renderStatic(); if (inst){ inst.render(); $('#phone').setAttribute('aria-label', S[lang].fmt[cur].n); } }));

/* theme */
function effTheme(){ const a = document.documentElement.getAttribute('data-theme'); if (a === 'dark' || a === 'light') return a; return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function themeIcon(){ const b = $('#themeBtn'), d = effTheme() === 'dark'; b.innerHTML = ic(d ? 'sun' : 'moon'); b.setAttribute('aria-label', S[lang].ui.theme); b.setAttribute('aria-pressed', d); }
const savedTheme = store.get('theme'); if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
$('#themeBtn').addEventListener('click', () => { const n = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store.set('theme', n); themeIcon(); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon);
window.addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', scrollY > 8), {passive:true});

/* ---------- the request form ---------- */
let lastReq = null;
// same rule as the server (functions/api/requests.js): an email, an @handle or a phone number
const contactOk = c => /@/.test(c) && c.replace(/[^\w]/g, '').length >= 3 || c.replace(/\D/g, '').length >= 9;
function readForm(){
  const what = ($('input[name="what"]:checked') || {}).value || '', company = $('#fCompany').value.trim(), msg = $('#fMsg').value.trim(), F = S[lang].f;
  return {who: FMT.includes(what) ? what : '', interest: what, name:$('#fName').value.trim(), contact:$('#fContact').value.trim(),
    message:(company ? F.company2 + ': ' + company + (msg ? '\n\n' : '') : '') + msg, lang, website:$('#fWeb').value};
}
function reqText(r){ const F = S[lang].f, D = S[lang]; return [F.what + ': ' + (r.interest === 'unsure' ? F.unsure : r.interest ? D.fmt[r.interest].n : '-'), F.name + ': ' + r.name, F.contact + ': ' + r.contact, '', r.message].join('\n'); }
function showSent(mode, err, quiet){
  const F = S[lang].f, box = $('#sent');
  const h = mode === 'ok' ? F.okH : mode === 'fail' ? F.failH : F.offH, p = mode === 'ok' ? F.ok : fill(mode === 'fail' ? F.fail : F.off, {email:CONFIG.email});
  box.innerHTML = '<div class="sent"><div class="ok' + (mode === 'ok' ? '' : ' warn') + '">' + ic(mode === 'ok' ? 'check' : 'mail') + '</div><h3 tabindex="-1">' + esc(h) + '</h3>' +
    (err ? '<p class="err-s">' + esc(err) + '</p>' : '') + '<p>' + esc(p) + '</p>' +
    (mode !== 'ok' ? '<pre id="reqText">' + esc(reqText(lastReq)) + '</pre><p style="margin-top:12px"><button type="button" class="btn ghost sm" id="copyReq">' + ic('copy') + '<span>' + esc(F.copy) + '</span></button></p>' : '') +
    '<button type="button" class="btn ghost sm" id="againReq">' + esc(mode === 'fail' ? (lang === 'ka' ? 'სცადეთ ხელახლა' : 'Try again') : F.again) + '</button></div>';
  box.hidden = false; $('#form').hidden = true;
  if (!quiet){ $('#sent h3').focus(); say(h); }
  const cp = $('#copyReq'); if (cp) cp.addEventListener('click', () => { navigator.clipboard && navigator.clipboard.writeText(reqText(lastReq)).then(() => { cp.lastChild.textContent = F.copied; }); });
  $('#againReq').addEventListener('click', () => { box.hidden = true; $('#form').hidden = false; if (mode === 'ok') $('#form').reset(); $('#fName').focus(); });
}
function validate(){
  const F = S[lang].f, name = $('#fName').value.trim(), c = $('#fContact').value.trim(), cOk = contactOk(c);
  $('#fbName').classList.toggle('bad', !name); $('#eName').textContent = name ? '' : F.eName; $('#fName').setAttribute('aria-invalid', !name);
  $('#fbContact').classList.toggle('bad', !cOk); $('#eContact').textContent = cOk ? '' : F.eContact; $('#fContact').setAttribute('aria-invalid', !cOk);
  if (!name){ $('#fName').focus(); return false; } if (!cOk){ $('#fContact').focus(); return false; } return true;
}
$('#form').addEventListener('submit', e => {
  e.preventDefault(); if (!validate()) return;
  lastReq = readForm();
  if (!CONFIG.formEndpoint){ lastReq.mode = 'off'; showSent('off'); return; }
  const sb = $('#sendBtn'), F = S[lang].f; sb.disabled = true; sb.firstChild.textContent = F.sending;
  fetch(CONFIG.formEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({summary:reqText(lastReq)}, lastReq))})
    .then(r => r.json().catch(() => ({})).then(d => { if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status)); lastReq.mode = 'ok'; lastReq.err = ''; showSent('ok'); }))
    .catch(err => { lastReq.mode = 'fail'; lastReq.err = err.message; showSent('fail', err.message); })
    .finally(() => { sb.disabled = false; sb.firstChild.textContent = S[lang].f.send; });
});
['#fName', '#fContact'].forEach(id => $(id).addEventListener('input', () => { if ($(id).closest('.field').classList.contains('bad')) validate(); }));

renderStatic();
mountDemo(FMT.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'learn');
})();

</script>
</body>
</html>
