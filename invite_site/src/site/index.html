<meta property="og:description" content="სასწავლო თამაშები, ონბორდინგი, ბრენდის თამაშები და მოსაწვევები ბმულით, ნებისმიერ ტელეფონზე. Games that train, onboard and sell.">

</style>

<body>
<a class="skip" href="#main">Skip to content · გადასვლა შინაარსზე</a>
<div id="sr" class="vh" role="status" aria-live="polite"></div>
<header class="hdr" id="hdr">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Gancda"><span class="mk" aria-hidden="true">გ</span><span>Gancda</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#who" data-t="nav.who"></a>
      <a href="#results" data-t="nav.results"></a>
      <a href="#packages" data-t="nav.packages"></a>
      <a href="#faq" data-t="nav.faq"></a>
    </nav>
    <div class="tools">
      <div class="seg2" role="group" aria-label="Language / ენა"><button type="button" data-lang="ka" lang="ka">ქა</button><button type="button" data-lang="en" lang="en">EN</button></div>
      <button type="button" class="ibtn" id="themeBtn"></button>
      <a class="btn sm acc cta" href="#contact" data-t="nav.cta"></a>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="eyebrow"><i></i><span data-t="hero.eyebrow"></span></p>
        <h1 data-th="hero.h"></h1>
        <p class="lede" data-t="hero.lede"></p>
        <div class="picker" id="picker" role="group"></div>
        <div class="row">
          <a class="btn acc" href="#contact"><span data-t="hero.cta"></span><span data-ic="arrow"></span></a>
          <a class="btn ghost" href="#who" data-t="hero.more"></a>
        </div>
        <ul class="facts" id="facts"></ul>
      </div>
      <div class="stage">
        <div class="phone"><div class="screen" id="phone" role="region"></div></div>
        <p class="cap"><i></i><span data-t="hero.cap"></span></p>
      </div>
    </div>
  </section>

  <section class="sec" id="who">
    <div class="wrap">
      <div class="sec-h"><p class="kick" data-t="who.kick"></p><h2 data-t="who.h"></h2><p data-t="who.p"></p></div>
      <div class="personas" id="whoList"></div>
    </div>
  </section>

  <section class="sec band" id="results">
    <div class="wrap dash-grid">
      <div>
        <p class="kick" data-t="res.kick"></p><h2 data-t="res.h"></h2><p class="lede" data-t="res.p"></p>
        <ul class="checks" id="resChecks"></ul>
      </div>
      <div class="dash" id="dash"></div>
    </div>
  </section>

  <section class="sec" id="packages">
    <div class="wrap">
      <div class="sec-h"><p class="kick" data-t="pk.kick"></p><h2 data-t="pk.h"></h2><p data-t="pk.p"></p></div>
      <div class="pkgs" id="pkgs"></div>
      <p class="unsure"><span data-ic="bolt"></span><a href="#contact" data-t="pk.unsure"></a></p>
      <p class="note" data-t="pk.note"></p>
    </div>
  </section>

  <section class="sec" id="how">
    <div class="wrap">
      <div class="sec-h"><p class="kick" data-t="how.kick"></p><h2 data-t="how.h"></h2><p data-t="how.p"></p></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="sec" id="faq">
    <div class="wrap faq-grid">
      <div class="sec-h"><p class="kick" data-t="faq.kick"></p><h2 data-t="faq.h"></h2></div>
      <div class="faq" id="faqList"></div>
    </div>
  </section>

  <section class="sec" id="contact">
    <div class="wrap contact">
      <div>
        <p class="kick" data-t="ct.kick"></p><h2 data-t="ct.h"></h2><p class="lede" data-t="ct.p"></p>
        <a class="mail" id="mail" href="mailto:hello@gancda.com"><span data-ic="mail"></span><span>hello@gancda.com</span></a>
      </div>
      <div class="form">
        <form id="form" novalidate>
          <div class="fgrid">
            <fieldset class="field full"><legend data-t="f.what"></legend><div class="chips" id="whatChips"></div></fieldset>
            <div class="field" id="fbName"><label for="fName" data-t="f.name"></label><input id="fName" name="name" autocomplete="name" aria-describedby="eName"><span class="err" id="eName" aria-live="polite"></span></div>
            <div class="field" id="fbContact"><label for="fContact" data-t="f.contact"></label><input id="fContact" name="contact" autocomplete="email" data-tp="f.contactPh" aria-describedby="eContact"><span class="err" id="eContact" aria-live="polite"></span></div>
            <div class="field full"><label for="fCompany" data-t="f.company"></label><input id="fCompany" name="company" autocomplete="organization"></div>
            <div class="field full"><label for="fMsg" data-t="f.msg"></label><textarea id="fMsg" name="message" data-tp="f.msgPh"></textarea></div>
          </div>
          <div class="hp" aria-hidden="true"><label for="fWeb">Website</label><input id="fWeb" name="website" tabindex="-1" autocomplete="off"></div>
          <div class="form-foot"><small data-t="f.note"></small><button type="submit" class="btn acc" id="sendBtn"><span data-t="f.send"></span><span data-ic="arrow"></span></button></div>
        </form>
        <div id="sent" hidden></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> Gancda · <span data-t="foot.made"></span></span>
    <span data-t="foot.demo"></span>
  </div>
</footer>
